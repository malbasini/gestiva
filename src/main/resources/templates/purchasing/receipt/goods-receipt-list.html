<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Ricezioni merci</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/layout :: appHeader}"></div>

  <main class="app-main">
    <div class="page">
      <div class="card">
        <div th:replace="~{fragments/layout :: flashMessages}"></div>
        <div class="page-header">
          <div class="page-header-left">
            <h1 class="page-title">Ricezioni merci</h1>
            <div class="muted">Carichi di magazzino dal ciclo passivo</div>
          </div>
          <div class="page-header-right">
          <a th:href="@{/dashboard}" class="btn btn-outline-secondary" style="margin-right: 10px;">
            <i class="bi bi-speedometer"></i>
            <span>Dashboard</span>
          </a>
          </div>
        </div>
        <form method="get" class="row g-3 align-items-end">
          <div class="col-md-4">
            <label for="q" class="form-label">Cerca</label>
            <input id="q"
                   name="q"
                   type="text"
                   class="form-control"
                   th:value="${q}"
                   placeholder="Numero..."/>
          </div>
          <div class="col-md-2">
            <label for="dateFrom" class="form-label">Data da</label>
            <input id="dateFrom"
                   name="dateFrom"
                   type="date"
                   class="form-control"
                   th:value="${dateFrom != null ? #temporals.format(dateFrom, 'yyyy-MM-dd') : ''}"/>
          </div>

          <div class="col-md-2">
            <label for="dateTo" class="form-label">Data a</label>
            <input id="dateTo"
                   name="dateTo"
                   type="date"
                   class="form-control"
                   th:value="${dateTo != null ? #temporals.format(dateTo, 'yyyy-MM-dd') : ''}"/>
          </div>

          <div class="col-md-2">
            <label for="size" class="form-label">Righe</label>
            <select id="size" name="size" class="form-select">
              <option value="10" th:selected="${size == 10}">10</option>
              <option value="20" th:selected="${size == 20}">20</option>
              <option value="50" th:selected="${size == 50}">50</option>
            </select>
          </div>

          <div class="col-md-2 d-flex gap-2">
            <button type="submit" class="btn btn-outline-primary">
              <i class="bi bi-search"></i>
              <span>Cerca</span>
            </button>

            <a class="btn btn-outline-secondary" th:href="@{/goods-receipts}">
              <i class="bi bi-x-circle"></i>
              <span>Reset</span>
            </a>
          </div>
        </form>
        <table class="table">
          <thead>
          <tr>
            <th>ID</th>
            <th>Numero</th>
            <th>Data</th>
            <th>Fornitore</th>
            <th>Ordine fornitore</th>
            <th>Azioni</th>
          </tr>
          </thead>
          <tbody>
          <tr th:if="${#lists.isEmpty(goodsReceipts)}">
            <td colspan="6" class="muted">Nessuna ricezione merci trovata.</td>
          </tr>
          <tr th:each="receipt : ${goodsReceipts}">
            <td th:text="${receipt.id}">1</td>
            <td th:text="${receipt.receiptNumber}">GR-00001</td>
            <td th:text="${receipt.formattedReceiptDate}">07/05/2026</td>
            <td th:text="${receipt.supplierName}">Fornitore Demo</td>
            <td th:text="${receipt.purchaseOrderNumber}">PO-00001</td>
            <td class="link-actions">
              <a th:href="@{/goods-receipts/{id}(id=${receipt.id})}">
                <i class="bi bi-eye"></i>
                <span>Dettaglio</span>
              </a>
            </td>
          </tr>
          </tbody>
        </table>
      </div>

      <div class="list-summary">
        <div class="muted">
          Totale risultati:
          <strong th:text="${page.totalElements}">0</strong>
        </div>

        <div class="pagination-wrap" th:if="${page.totalPages > 1}">
          <nav aria-label="Paginazione">
            <ul class="pagination pagination-sm mb-0">

              <li class="page-item" th:classappend="${page.first} ? ' disabled'">
                <a class="page-link"
                   th:href="${page.first} ? '#' : @{/goods-receipts(page=${page.number - 1}, size=${size}, q=${q}, dateFrom=${dateFrom}, dateTo=${dateTo})}">
                  Precedente
                </a>
              </li>
              <li class="page-item"
                  th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                  th:classappend="${i == page.number} ? ' active'">
                <a class="page-link"
                   th:text="${i + 1}"
                   th:href="@{/goods-receipts(page=${i}, size=${size}, q=${q}, dateFrom=${dateFrom}, dateTo=${dateTo})}">
                  1
                </a>
              </li>
              <li class="page-item" th:classappend="${page.last} ? ' disabled'">
                <a class="page-link"
                   th:href="${page.last} ? '#' : @{/goods-receipts(page=${page.number + 1}, size=${size}, q=${q}, dateFrom=${dateFrom}, dateTo=${dateTo})}">
                  Successiva
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </div>
  </main>
  <div th:replace="~{fragments/layout :: appFooter}"></div>
</div>
</body>
</html>
