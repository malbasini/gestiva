<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${formMode == 'create'} ? 'Nuovo ordine fornitore' : 'Modifica ordine fornitore'">Ordine fornitore</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/layout :: appHeader}"></div>

  <main class="app-main">
    <div class="page">
      <div class="card">

        <div class="breadcrumb">
          <a th:href="@{/dashboard}">Dashboard</a> /
          <a th:href="@{/purchase-orders}">Ordini fornitore</a> /
          <span th:text="${formMode == 'create'} ? 'Nuovo ordine' : 'Modifica ordine'">Ordine</span>
        </div>

        <div class="page-header">
          <div class="page-header-left">
            <h1 class="page-title" th:text="${formMode == 'create'} ? 'Nuovo ordine fornitore' : 'Modifica ordine fornitore'">Ordine</h1>
            <div class="muted">Ciclo passivo</div>
          </div>
          <div class="page-header-right">
            <a class="btn btn-secondary" th:href="@{/purchase-orders}">
              <i class="bi bi-arrow-left"></i>
              <span>Torna alla lista</span>
            </a>
          </div>
        </div>

        <form th:action="${formMode == 'create'} ? @{/purchase-orders} : @{/purchase-orders/{id}(id=${purchaseOrderId})}"
              th:object="${purchaseOrderForm}"
              method="post">

          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <div class="form-grid">
            <div class="form-field">
              <label for="supplierId">Fornitore</label>
              <select id="supplierId" th:field="*{supplierId}">
                <option value="">Seleziona</option>
                <option th:each="opt : ${supplierOptions}"
                        th:value="${opt.id}"
                        th:text="${opt.label}">
                  SUP-001 - Fornitore Demo
                </option>
              </select>
            </div>

            <div class="form-field">
              <label for="orderDate">Data ordine</label>
              <input id="orderDate" type="date" th:field="*{orderDate}"/>
            </div>

            <div class="form-field">
              <label for="expectedDeliveryDate">Consegna prevista</label>
              <input id="expectedDeliveryDate" type="date" th:field="*{expectedDeliveryDate}"/>
            </div>

            <div class="form-field">
              <label for="status">Stato</label>
              <select id="status" th:field="*{status}">
                <option value="DRAFT">DRAFT</option>
                <option value="SENT">SENT</option>
                <option value="CONFIRMED">CONFIRMED</option>
                <option value="CANCELLED">CANCELLED</option>
              </select>
            </div>

            <div class="form-field">
              <label for="currencyCode">Valuta</label>
              <input id="currencyCode" type="text" th:field="*{currencyCode}" placeholder="EUR"/>
            </div>

            <div class="form-field full">
              <label for="notes">Note</label>
              <textarea id="notes" th:field="*{notes}" rows="3" placeholder="Note ordine fornitore"></textarea>
            </div>
          </div>

          <div class="page-header" style="margin-top:28px;">
            <div class="page-header-left">
              <h2 class="section-title" style="margin:0;">Righe ordine</h2>
            </div>
          </div>

          <div class="actions" style="margin-top:16px;">
            <button type="submit" name="addLine" value="true" class="btn btn-secondary">
              <i class="bi bi-plus-lg"></i>
              <span>Aggiungi riga</span>
            </button>
          </div>

          <table class="table">
            <thead>
            <tr>
              <th>#</th>
              <th>Articolo</th>
              <th>Descrizione</th>
              <th>Quantità</th>
              <th>Prezzo</th>
              <th>Sconto %</th>
              <th>IVA %</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="line, stat : *{lines}">
              <td th:text="${stat.index + 1}">1</td>
              <td>
                <select th:field="*{lines[__${stat.index}__].itemId}"
                        class="js-item-select"
                        th:attr="data-row-index=${stat.index}">
                  <option value="">-- articolo --</option>
                  <option th:each="opt : ${itemOptions}"
                          th:value="${opt.id}"
                          th:text="${opt.label}">
                    ART-001 - Prodotto
                  </option>
                </select>
              </td>
              <td>
                <input type="text"
                       th:field="*{lines[__${stat.index}__].description}"
                       class="js-line-description"
                       th:attr="data-row-index=${stat.index}"
                       placeholder="Descrizione riga"/>
              </td>
              <td>
                <input type="number" step="0.001"
                       th:field="*{lines[__${stat.index}__].quantity}"/>
              </td>
              <td>
                <input type="number" step="0.01"
                       th:field="*{lines[__${stat.index}__].unitPrice}"
                       class="js-line-unit-price"
                       th:attr="data-row-index=${stat.index}"/>
              </td>
              <td>
                <input type="number" step="0.01"
                       th:field="*{lines[__${stat.index}__].discountPct}"/>
              </td>
              <td>
                <input type="number" step="0.01"
                       th:field="*{lines[__${stat.index}__].taxPct}"
                       class="js-line-tax-pct"
                       th:attr="data-row-index=${stat.index}"/>
              </td>
              <td>
                <button type="submit"
                        name="removeLine"
                        th:value="${stat.index}"
                        class="btn btn-secondary">
                  <i class="bi bi-trash"></i>
                  <span>Rimuovi</span>
                </button>
              </td>
            </tr>
            </tbody>
          </table>

          <div class="actions" style="margin-top:24px;">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-floppy"></i>
              <span th:text="${formMode == 'create'} ? 'Crea ordine' : 'Salva modifiche'">Salva</span>
            </button>
          </div>
        </form>

      </div>
    </div>
  </main>
  <div th:replace="~{fragments/layout :: appFooter}"></div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const selects = document.querySelectorAll('.js-item-select');

    function findRowField(selector, rowIndex) {
      return document.querySelector(selector + '[data-row-index="' + rowIndex + '"]');
    }

    function fillRowFromItem(rowIndex, item) {
      const descriptionInput = findRowField('.js-line-description', rowIndex);
      const unitPriceInput = findRowField('.js-line-unit-price', rowIndex);
      const taxPctInput = findRowField('.js-line-tax-pct', rowIndex);

      if (descriptionInput) {
        descriptionInput.value = item.description && item.description.trim() !== ''
                ? item.description
                : item.name || '';
      }

      if (unitPriceInput) {
        unitPriceInput.value = item.basePrice != null ? item.basePrice : 0;
      }

      if (taxPctInput) {
        taxPctInput.value = item.defaultTaxPct != null ? item.defaultTaxPct : 0;
      }
    }

    selects.forEach(function (select) {
      select.addEventListener('change', function () {
        const itemId = this.value;
        const rowIndex = this.dataset.rowIndex;

        if (!itemId) {
          return;
        }

        fetch('/api/items/' + itemId + '/autocomplete', {
          headers: {
            'X-Requested-With': 'XMLHttpRequest'
          }
        })
                .then(function (response) {
                  if (!response.ok) {
                    throw new Error('Errore nel recupero dati articolo');
                  }
                  return response.json();
                })
                .then(function (item) {
                  fillRowFromItem(rowIndex, item);
                })
                .catch(function (error) {
                  console.error(error);
                });
      });
    });
  });
</script>
</body>
</html>
