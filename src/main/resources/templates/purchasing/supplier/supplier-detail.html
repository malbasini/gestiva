<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="'Fornitore ' + ${supplier.code}">Dettaglio fornitore</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/layout :: appHeader}"></div>

  <main class="app-main">
    <div class="page">
      <div class="card">

        <div th:replace="~{fragments/layout :: flashMessages}"></div>

        <div class="breadcrumb">
          <a th:href="@{/dashboard}">Dashboard</a> /
          <a th:href="@{/suppliers}">Fornitori</a> /
          <span th:text="${supplier.code}">SUP-001</span>
        </div>

        <div class="page-header">
          <div class="page-header-left">
            <h1 class="page-title" th:text="${supplier.name}">Fornitore</h1>
            <div class="muted" th:text="${supplier.code}">SUP-001</div>
          </div>
          <div class="page-header-right">
            <a class="btn btn-outline-secondary" th:href="@{/suppliers}">
              <i class="bi bi-arrow-left"></i>
              <span>Torna alla lista</span>
            </a>
            <a class="btn btn-outine-warning" th:href="@{/suppliers/{id}/edit(id=${supplier.id})}">
              <i class="bi bi-pencil-square"></i>
              <span>Modifica</span>
            </a>
          </div>
        </div>

        <div class="info-grid">
          <div class="info-box">
            <div class="label">Codice</div>
            <div class="value" th:text="${supplier.code}">SUP-001</div>
          </div>
          <div class="info-box">
            <div class="label">P.IVA</div>
            <div class="value" th:text="${supplier.vatNumber != null ? supplier.vatNumber : '-'}">IT123</div>
          </div>
          <div class="info-box">
            <div class="label">Codice fiscale</div>
            <div class="value" th:text="${supplier.taxCode != null ? supplier.taxCode : '-'}">ABC123</div>
          </div>
          <div class="info-box">
            <div class="label">Stato</div>
            <div class="value" th:text="${supplier.active ? 'ACTIVE' : 'INACTIVE'}">ACTIVE</div>
          </div>
        </div>

        <div class="info-grid">
          <div class="info-box">
            <div class="label">Email</div>
            <div class="value" th:text="${supplier.email != null ? supplier.email : '-'}">mail@example.com</div>
          </div>
          <div class="info-box">
            <div class="label">Telefono</div>
            <div class="value" th:text="${supplier.phone != null ? supplier.phone : '-'}">123456</div>
          </div>
          <div class="info-box">
            <div class="label">Paese</div>
            <div class="value" th:text="${supplier.countryCode != null ? supplier.countryCode : '-'}">IT</div>
          </div>
          <div class="info-box">
            <div class="label">Provincia</div>
            <div class="value" th:text="${supplier.province != null ? supplier.province : '-'}">RM</div>
          </div>
        </div>

        <div class="info-grid three-cols">
          <div class="info-box">
            <div class="label">Indirizzo</div>
            <div class="value" th:text="${supplier.addressLine != null ? supplier.addressLine : '-'}">Via Roma 1</div>
          </div>
          <div class="info-box">
            <div class="label">Città</div>
            <div class="value" th:text="${supplier.city != null ? supplier.city : '-'}">Roma</div>
          </div>
          <div class="info-box">
            <div class="label">CAP</div>
            <div class="value" th:text="${supplier.postalCode != null ? supplier.postalCode : '-'}">00100</div>
          </div>
        </div>

        <div class="notes" th:if="${supplier.notes != null and !#strings.isEmpty(supplier.notes)}">
          <strong>Note</strong><br/>
          <span th:text="${supplier.notes}">Note fornitore</span>
        </div>

      </div>
    </div>
  </main>
  <div th:replace="~{fragments/layout :: appFooter}"></div>
</div>
</body>
</html>
