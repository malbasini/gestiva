<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Fornitori</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/layout :: appHeader}"></div>

  <main class="app-main">
    <div class="page">
      <div class="card">

        <div th:replace="~{fragments/layout :: flashMessages}"></div>

        <div class="breadcrumb">
          <a th:href="@{/dashboard}">Dashboard</a> /
          <span>Fornitori</span>
        </div>

        <div class="page-header">
          <div class="page-header-left">
            <h1 class="page-title">Fornitori</h1>
            <div class="muted">Anagrafica fornitori del ciclo passivo</div>
          </div>
          <div class="page-header-right">
            <a class="btn btn-primary" th:href="@{/suppliers/new}">
              <i class="bi bi-plus-lg"></i>
              <span>Nuovo fornitore</span>
            </a>
          </div>
        </div>

        <table class="table">
          <thead>
          <tr>
            <th>ID</th>
            <th>Codice</th>
            <th>Nome</th>
            <th>P.IVA</th>
            <th>Email</th>
            <th>Telefono</th>
            <th>Stato</th>
            <th>Azioni</th>
          </tr>
          </thead>
          <tbody>
          <tr th:if="${#lists.isEmpty(suppliers)}">
            <td colspan="8" class="muted">Nessun fornitore trovato.</td>
          </tr>
          <tr th:each="supplier : ${suppliers}">
            <td th:text="${supplier.id}">1</td>
            <td th:text="${supplier.code}">SUP-001</td>
            <td th:text="${supplier.name}">Fornitore Demo</td>
            <td th:text="${supplier.vatNumber != null ? supplier.vatNumber : '-'}">IT123</td>
            <td th:text="${supplier.email != null ? supplier.email : '-'}">mail@example.com</td>
            <td th:text="${supplier.phone != null ? supplier.phone : '-'}">123456</td>
            <td>
                            <span class="badge" th:classappend="${supplier.active} ? ' badge-active' : ' badge-inactive'"
                                  th:text="${supplier.active ? 'ACTIVE' : 'INACTIVE'}">ACTIVE</span>
            </td>
            <td class="link-actions">
              <a th:href="@{/suppliers/{id}(id=${supplier.id})}">
                <i class="bi bi-eye"></i>
                <span>Dettaglio</span>
              </a>
              <a th:href="@{/suppliers/{id}/edit(id=${supplier.id})}">
                <i class="bi bi-pencil-square"></i>
                <span>Modifica</span>
              </a>
            </td>
          </tr>
          </tbody>
        </table>

      </div>
    </div>
  </main>
  <div th:replace="~{fragments/layout :: appFooter}"></div>
</div>
</body>
</html>
