<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Fornitori</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/layout :: appHeader}"></div>

  <main class="app-main">
    <div class="page">
      <div class="card">
        <div th:replace="~{fragments/layout :: flashMessages}"></div>
        <div class="page-header">
          <div class="page-header-left">
            <h1 class="page-title">Fornitori</h1>
            <div class="muted">Anagrafica fornitori del ciclo passivo</div>
          </div>
          <div class="page-header-right">
            <a th:href="@{/dashboard}" class="btn btn-outline-secondary" style="margin-right: 10px;">
              <i class="bi bi-speedometer"></i>
              <span>Dashboard</span>
            </a>
            <a class="btn btn-outline-primary" th:href="@{/suppliers/new}">
              <i class="bi bi-plus-lg"></i>
              <span>Nuovo fornitore</span>
            </a>
          </div>
        </div>
        <form method="get" class="list-toolbar">
          <div class="toolbar-field search-field">
            <label for="q" class="form-label">Cerca</label>
            <input id="q"
                   name="q"
                   type="text"
                   class="form-control"
                   th:value="${q}"
                   placeholder="Codice, nome, P.IVA, email..."/>
          </div>
          <div class="toolbar-field">
            <label for="status" class="form-label">Stato</label>
            <select id="status" name="status" class="form-select">
              <option value="">Tutti</option>
              <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">Attivi</option>
              <option value="INACTIVE" th:selected="${status == 'INACTIVE'}">Non attivi</option>
            </select>
          </div>
          <div class="toolbar-field">
            <label for="size" class="form-label">Righe</label>
            <select id="size" name="size" class="form-select">
              <option value="10" th:selected="${size == 10}">10</option>
              <option value="20" th:selected="${size == 20}">20</option>
              <option value="50" th:selected="${size == 50}">50</option>
            </select>
          </div>
          <div class="toolbar-field toolbar-actions">
            <button type="submit" class="btn btn-outline-primary">
              <i class="bi bi-search"></i>
              <span>Cerca</span>
            </button>
            <a class="btn btn-outline-secondary" th:href="@{/suppliers}">
              <i class="bi bi-x-circle"></i>
              <span>Reset</span>
            </a>
          </div>
        </form>
        <table class="table">
          <thead>
          <tr>
            <th>ID</th>
            <th>Codice</th>
            <th>Nome</th>
            <th>P.IVA</th>
            <th>Email</th>
            <th>Telefono</th>
            <th>Stato</th>
            <th>Azioni</th>
          </tr>
          </thead>
          <tbody>
          <tr th:if="${#lists.isEmpty(suppliers)}">
            <td colspan="8" class="muted">Nessun fornitore trovato.</td>
          </tr>
          <tr th:each="supplier : ${suppliers}">
            <td th:text="${supplier.id}">1</td>
            <td th:text="${supplier.code}">SUP-001</td>
            <td th:text="${supplier.name}">Fornitore Demo</td>
            <td th:text="${supplier.vatNumber != null ? supplier.vatNumber : '-'}">IT123</td>
            <td th:text="${supplier.email != null ? supplier.email : '-'}">mail@example.com</td>
            <td th:text="${supplier.phone != null ? supplier.phone : '-'}">123456</td>
            <td>
                            <span class="badge" th:classappend="${supplier.active} ? ' badge-active' : ' badge-inactive'"
                                  th:text="${supplier.active ? 'ACTIVE' : 'INACTIVE'}">ACTIVE</span>
            </td>
            <td class="link-actions">
              <a th:href="@{/suppliers/{id}(id=${supplier.id})}">
                <i class="bi bi-eye"></i>
                <span>Dettaglio</span>
              </a>
              <a th:href="@{/suppliers/{id}/edit(id=${supplier.id})}">
                <i class="bi bi-pencil-square"></i>
                <span>Modifica</span>
              </a>
            </td>
          </tr>
          </tbody>
        </table>
      </div>

      <div class="list-summary">
        <div class="muted">
          Totale risultati:
          <strong th:text="${page.totalElements}">0</strong>
        </div>

        <div class="pagination-wrap" th:if="${page.totalPages > 1}">
          <nav aria-label="Paginazione">
            <ul class="pagination pagination-sm mb-0">
              <li class="page-item" th:classappend="${page.first} ? ' disabled'">
                <a class="page-link"
                   th:href="${page.first} ? '#' : @{/suppliers(page=${page.number - 1}, size=${size}, q=${q}, status=${status})}">
                  Precedente
                </a>
              </li>
              <li class="page-item"
                  th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                  th:classappend="${i == page.number} ? ' active'">
                <a class="page-link"
                   th:text="${i + 1}"
                   th:href="@{/suppliers(page=${i}, size=${size}, q=${q}, status=${status})}">
                  1
                </a>
              </li>
              <li class="page-item" th:classappend="${page.last} ? ' disabled'">
                <a class="page-link"
                   th:href="${page.last} ? '#' : @{/suppliers(page=${page.number + 1}, size=${size}, q=${q}, status=${status})}">
                  Successiva
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </div>
  </main>
  <div th:replace="~{fragments/layout :: appFooter}"></div>
</div>
</body>
</html>
