<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${formMode == 'create'} ? 'Nuovo fornitore' : 'Modifica fornitore'">Fornitore</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/layout :: appHeader}"></div>

  <main class="app-main">
    <div class="page">
      <div class="card">
        <div th:replace="~{fragments/layout :: flashMessages}"></div>

        <div class="page-header">
          <div class="page-header-left">
            <h1 class="page-title" th:text="${formMode == 'create'} ? 'Nuovo fornitore' : 'Modifica fornitore'">Fornitore</h1>
            <div class="muted">Anagrafica ciclo passivo</div>
          </div>
          <div class="page-header-right">
            <a class="btn btn-outline-secondary" th:href="@{/suppliers}">
              <i class="bi bi-arrow-left"></i>
              <span>Torna alla lista</span>
            </a>
          </div>
        </div>

        <form th:action="${formMode == 'create'} ? @{/suppliers} : @{/suppliers/{id}(id=${supplierId})}"
              th:object="${supplierForm}"
              method="post">

          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <div class="form-grid">
            <div class="form-field">
              <label for="code">Codice</label>
              <input id="code" type="text" class="form-control" th:field="*{code}" placeholder="SUP-001"/>
              <div class="field-error" th:if="${#fields.hasErrors('code')}" th:errors="*{code}">Errore</div>
            </div>

            <div class="form-field">
              <label for="name">Nome</label>
              <input id="name" type="text" class="form-control" th:field="*{name}" placeholder="Fornitore Demo Srl"/>
              <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Errore</div>
            </div>

            <div class="form-field">
              <label for="vatNumber">Partita IVA</label>
              <input id="vatNumber" type="text" class="form-control" th:field="*{vatNumber}" placeholder="IT12345678901"/>
              <div class="field-error" th:if="${#fields.hasErrors('vatNumber')}" th:errors="*{vatNumber}">Errore</div>
            </div>

            <div class="form-field">
              <label for="taxCode">Codice fiscale</label>
              <input id="taxCode" type="text" class="form-control" th:field="*{taxCode}" placeholder="RSSMRA80A01H501Z"/>
              <div class="field-error" th:if="${#fields.hasErrors('taxCode')}" th:errors="*{taxCode}">Errore</div>
            </div>

            <div class="form-field">
              <label for="email">Email</label>
              <input id="email" type="email" class="form-control" th:field="*{email}" placeholder="fornitore@example.com"/>
              <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Errore</div>
            </div>

            <div class="form-field">
              <label for="phone">Telefono</label>
              <input id="phone" type="text" class="form-control" th:field="*{phone}" placeholder="+39 0123456789"/>
              <div class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">Errore</div>
            </div>

            <div class="form-field full">
              <label for="addressLine">Indirizzo</label>
              <input id="addressLine" type="text" class="form-control" th:field="*{addressLine}" placeholder="Via Roma 1"/>
              <div class="field-error" th:if="${#fields.hasErrors('addressLine')}" th:errors="*{addressLine}">Errore</div>
            </div>

            <div class="form-field">
              <label for="city">Città</label>
              <input id="city" type="text" class="form-control" th:field="*{city}" placeholder="Roma"/>
              <div class="field-error" th:if="${#fields.hasErrors('city')}" th:errors="*{city}">Errore</div>
            </div>

            <div class="form-field">
              <label for="postalCode">CAP</label>
              <input id="postalCode" type="text" class="form-control" th:field="*{postalCode}" placeholder="00100"/>
              <div class="field-error" th:if="${#fields.hasErrors('postalCode')}" th:errors="*{postalCode}">Errore</div>
            </div>

            <div class="form-field">
              <label for="province">Provincia</label>
              <input id="province" type="text"class="form-control"  th:field="*{province}" placeholder="RM"/>
              <div class="field-error" th:if="${#fields.hasErrors('province')}" th:errors="*{province}">Errore</div>
            </div>

            <div class="form-field">
              <label for="countryCode">Paese</label>
              <input id="countryCode" type="text" class="form-control" th:field="*{countryCode}" placeholder="IT"/>
              <div class="field-error" th:if="${#fields.hasErrors('countryCode')}" th:errors="*{countryCode}">Errore</div>
            </div>

            <div class="form-field full">
              <label for="notes">Note</label>
              <textarea id="notes" th:field="*{notes}"class="form-control"   rows="4" placeholder="Note fornitore"></textarea>
              <div class="field-error" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}">Errore</div>
            </div>

            <div class="form-field">
              <label class="checkbox-field">
                <input type="checkbox" th:field="*{active}"/>
                <span>Fornitore attivo</span>
              </label>
            </div>
          </div>

          <div class="actions" style="margin-top:24px;">
            <button type="submit" class="btn btn-outline-primary">
              <i class="bi bi-floppy"></i>
              <span th:text="${formMode == 'create'} ? 'Crea fornitore' : 'Salva modifiche'">Salva</span>
            </button>
          </div>
        </form>

      </div>
    </div>
  </main>
  <div th:replace="~{fragments/layout :: appFooter}"></div>
</div>
</body>
</html>
