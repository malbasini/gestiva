<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Fatture fornitore</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/layout :: appHeader}"></div>

  <main class="app-main">
    <div class="page">
      <div class="card">
        <div th:replace="~{fragments/layout :: flashMessages}"></div>

        <div class="breadcrumb">
          <a th:href="@{/dashboard}">Dashboard</a> /
          <span>Fatture fornitore</span>
        </div>

        <div class="page-header">
          <div class="page-header-left">
            <h1 class="page-title">Fatture fornitore</h1>
            <div class="muted">Documenti amministrativi del ciclo passivo</div>
          </div>
        </div>

        <table class="table">
          <thead>
          <tr>
            <th>ID</th>
            <th>Numero</th>
            <th>Data</th>
            <th>Fornitore</th>
            <th>Stato</th>
            <th>Totale</th>
            <th>Azioni</th>
          </tr>
          </thead>
          <tbody>
          <tr th:if="${#lists.isEmpty(supplierInvoices)}">
            <td colspan="7" class="muted">Nessuna fattura fornitore trovata.</td>
          </tr>
          <tr th:each="invoice : ${supplierInvoices}">
            <td th:text="${invoice.id}">1</td>
            <td th:text="${invoice.invoiceNumber}">SI-00001</td>
            <td th:text="${invoice.formattedInvoiceDate}">08/05/2026</td>
            <td th:text="${invoice.supplierName}">Fornitore Demo</td>
            <td>
                            <span class="badge"
                                  th:classappend="${invoice.status == 'DRAFT'} ? ' badge-draft' :
                                                  (${invoice.status == 'REGISTERED'} ? ' badge-confirmed' : ' badge-cancelled')"
                                  th:text="${invoice.status}">DRAFT</span>
            </td>
            <td th:text="${invoice.formattedTotalAmount}">122,00 €</td>
            <td class="link-actions">
              <a th:href="@{/supplier-invoices/{id}(id=${invoice.id})}">
                <i class="bi bi-eye"></i>
                <span>Dettaglio</span>
              </a>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
  <div th:replace="~{fragments/layout :: appFooter}"></div>
</div>
</body>
</html>
