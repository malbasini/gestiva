<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>DDT</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>
<body>
<div class="app-shell">

  <div th:replace="~{fragments/layout :: appHeader}"></div>

  <main class="app-main">
    <div class="page">
      <div class="card">

        <div class="breadcrumb">
          <a th:href="@{/dashboard(tenantId=${tenantId})}">Dashboard</a> /
          <span>DDT</span>
        </div>

        <div class="page-header">
          <div class="page-header-left">
            <h1 class="page-title">Documenti di trasporto</h1>
            <div class="muted">Elenco DDT generati dagli ordini evasi</div>
          </div>
        </div>

        <form method="get" class="row g-3 align-items-end">
          <div class="col-md-3">
            <label for="q" class="form-label">Cerca</label>
            <input id="q"
                   name="q"
                   type="text"
                   class="form-control"
                   th:value="${q}"
                   placeholder="Numero DDT..."/>
          </div>
          <div class="col-md-2">
            <label for="status" class="form-label">Stato</label>
            <select id="status" name="status" class="form-select">
              <option value="">Tutti</option>
              <option value="DRAFT" th:selected="${status == 'DRAFT'}">Draft</option>
              <option value="ISSUED" th:selected="${status == 'ISSUED'}">Issued</option>
              <option value="CANCELLED" th:selected="${status == 'CANCELLED'}">Cancelled</option>
            </select>
          </div>
          <div class="col-md-2">
            <label for="dateFrom" class="form-label">Data da</label>
            <input id="dateFrom"
                   name="dateFrom"
                   type="date"
                   class="form-control"
                   th:value="${dateFrom != null ? #temporals.format(dateFrom, 'yyyy-MM-dd') : ''}"/>
          </div>
          <div class="col-md-2">
            <label for="dateTo" class="form-label">Data a</label>
            <input id="dateTo"
                   name="dateTo"
                   type="date"
                   class="form-control"
                   th:value="${dateTo != null ? #temporals.format(dateTo, 'yyyy-MM-dd') : ''}"/>
          </div>
          <div class="col-md-1">
            <label for="size" class="form-label">Righe</label>
            <select id="size" name="size" class="form-select">
              <option value="10" th:selected="${size == 10}">10</option>
              <option value="20" th:selected="${size == 20}">20</option>
              <option value="50" th:selected="${size == 50}">50</option>
            </select>
          </div>
          <div class="col-md-2 d-flex gap-2">
            <button type="submit" class="btn btn-secondary">
              <i class="bi bi-search"></i>
              <span>Cerca</span>
            </button>
            <a class="btn btn-secondary" th:href="@{/delivery-notes}">
              <i class="bi bi-x-circle"></i>
              <span>Reset</span>
            </a>
          </div>
        </form>

        <table class="table">
          <thead>
          <tr>
            <th>ID</th>
            <th>Numero</th>
            <th>Data</th>
            <th>Cliente</th>
            <th>Stato</th>
            <th class="text-right">Totale</th>
            <th>Azioni</th>
          </tr>
          </thead>
          <tbody>
          <tr th:if="${#lists.isEmpty(deliveryNotesPage.content)}">
            <td colspan="8" class="muted">Nessun DDT trovato.</td>
          </tr>
          <tr th:each="deliveryNote : ${deliveryNotesPage.content}">
            <td th:text="${deliveryNote.id}">1</td>
            <td th:text="${deliveryNote.ddtNumber}">DDT-2026-00001</td>
            <td th:text="${deliveryNote.formattedDdtDate}">03/05/2026</td>
            <td th:text="${deliveryNote.customerName}">Rossi Srl</td>
            <td>
                            <span class="badge"
                                  th:classappend="${deliveryNote.status == 'ISSUED'} ? ' badge-confirmed' : ' badge-cancelled'"
                                  th:text="${deliveryNote.status}">
                                ISSUED
                            </span>
            </td>
            <td class="text-right" th:text="${deliveryNote.formattedTotalAmount}">1.220,00 €</td>
            <td class="link-actions">
              <a th:href="@{/delivery-notes/{id}(id=${deliveryNote.id}, tenantId=${tenantId})}">
                <i class="bi bi-file-earmark-text"></i>
                <span>Dettaglio</span>
              </a>
              <a th:href="@{/orders/{id}(id=${deliveryNote.salesOrderId}, tenantId=${tenantId})}">
                <i class="bi bi-box-seam"></i>
                <span>Ordine</span>
              </a>
              <a th:href="@{/delivery-notes/{id}/preview(id=${deliveryNote.id}, tenantId=${tenantId})}">
                <i class="bi bi-eye"></i>
                <span>Preview</span>
              </a>
              <a th:href="@{/api/delivery-notes/{id}/pdf(id=${deliveryNote.id}, tenantId=${tenantId})}">
                <i class="bi bi-file-earmark-pdf"></i>
                <span>PDF</span>
              </a>
            </td>
          </tr>
          </tbody>
        </table>

        <div class="list-summary">
          <div class="muted">
            Totale risultati:
            <strong th:text="${page.totalElements}">0</strong>
          </div>
          <div class="pagination-wrap" th:if="${page.totalPages > 1}">
            <nav aria-label="Paginazione">
              <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${page.first} ? ' disabled'">
                  <a class="page-link"
                     th:href="${page.first} ? '#' : @{/delivery-notes(page=${page.number - 1}, size=${size}, q=${q}, status=${status}, dateFrom=${dateFrom}, dateTo=${dateTo})}">
                    Precedente
                  </a>
                </li>
                <li class="page-item"
                    th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                    th:classappend="${i == page.number} ? ' active'">
                  <a class="page-link"
                     th:text="${i + 1}"
                     th:href="@{/delivery-notes(page=${i}, size=${size}, q=${q}, status=${status}, dateFrom=${dateFrom}, dateTo=${dateTo})}">
                    1
                  </a>
                </li>
                <li class="page-item" th:classappend="${page.last} ? ' disabled'">
                  <a class="page-link"
                     th:href="${page.last} ? '#' : @{/delivery-notes(page=${page.number + 1}, size=${size}, q=${q}, status=${status}, dateFrom=${dateFrom}, dateTo=${dateTo})}">
                    Successiva
                  </a>
                </li>
              </ul>
            </nav>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div th:replace="~{fragments/layout :: appFooter}"></div>

</div>
</body>
</html>
