<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Contatti Gestiva</title>
  <title>Gestiva - Gestionale modulare per PMI e professionisti</title>
  <meta name="description" content="Gestiva è un gestionale modulare per PMI e professionisti con ciclo attivo, ciclo passivo, magazzino, contabilità e guida online integrata.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://gestiva.org/contact">
  <meta property="og:title" content="Gestiva - Gestionale modulare per PMI e professionisti">
  <meta property="og:description" content="Gestionale modulare con ciclo attivo, ciclo passivo, magazzino, contabilità e guida online integrata.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://gestiva.org/">
  <meta property="og:site_name" content="Gestiva">
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="icon" type="icon" th:href="@{/favicon.ico}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
<br>
<h1 class="mb-4" style="text-align: center">CONTATTA GESTIVA</h1>
<br>
            <div class="page-header">
               <div class="page-header-left">
                   <h3 class="mb-4"></h3>
               </div>
               <div class="page-header-right">
                  <a class="btn btn-outline-success" th:href="@{/}">
                      <i class="bi bi-house"></i>
                      <span>Torna alla home</span>
                  </a>
                  <a th:href="@{/dashboard}" class="btn btn-outline-secondary" style="margin-right: 10px;">
                    <i class="bi bi-speedometer"></i>
                    <span>Torna alla Dashboard</span>
                  </a>
            </div>
         </div>
         <div class="container py-5" style="max-width: 760px;">
         <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
         <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

          <form th:action="@{/contact}" th:object="${contactForm}" method="post" class="card shadow-sm border-0 rounded-4 p-4">
             <div class="mb-3">
      <label class="form-label">Nome</label>
      <input type="text" th:field="*{name}" class="form-control">
      <div class="text-danger small" th:errors="*{name}"></div>
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" th:field="*{email}" class="form-control">
      <div class="text-danger small" th:errors="*{email}"></div>
    </div>

    <div class="mb-3">
      <label class="form-label">Oggetto</label>
      <input type="text" th:field="*{subject}" class="form-control">
      <div class="text-danger small" th:errors="*{subject}"></div>
    </div>

    <div class="mb-3">
      <label class="form-label">Messaggio</label>
      <textarea th:field="*{message}" class="form-control" rows="6"></textarea>
      <div class="text-danger small" th:errors="*{message}"></div>
    </div>

    <div>
      <button type="submit" class="btn btn-primary">Invia richiesta</button>
    </div>
  </form>
</div>
</body>
</html>
