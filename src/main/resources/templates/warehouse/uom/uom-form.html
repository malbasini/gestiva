<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Nuova unità di misura - Gestiva V2</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>

<body>
<div class="app-shell">

    <div th:replace="~{fragments/layout :: appHeader}"></div>

    <main class="app-main">
        <div class="page">
            <div class="card">

                <div th:replace="~{fragments/layout :: flashMessages}"></div>

                <div class="page-header">
                    <div class="page-header-left">
                        <h1 class="page-title">Nuova unità di misura</h1>
                        <div class="muted">
                            Configura una nuova unità utilizzabile
                            negli articoli e nei documenti.
                        </div>
                    </div>

                    <div class="page-header-right">
                        <a class="btn btn-outline-secondary"
                           th:href="@{/warehouse/uoms}">
                            <i class="bi bi-arrow-left"></i>
                            Torna alla lista
                        </a>
                    </div>
                </div>

                <form th:action="@{/warehouse/uoms}"
                      th:object="${uomForm}"
                      method="post">

                    <div class="alert alert-danger"
                         th:if="${#fields.hasErrors('*')}">
                        Controlla i campi evidenziati e riprova.
                    </div>

                    <input type="hidden"
                           th:if="${_csrf != null}"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>

                    <div class="mb-3">
                        <label for="code" class="form-label">
                            Codice *
                        </label>

                        <input type="text"
                               id="code"
                               class="form-control"
                               th:field="*{code}"
                               maxlength="20"
                               placeholder="Es. BOX"
                               required/>

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('code')}"
                             th:errors="*{code}">
                        </div>

                        <div class="muted">
                            Il codice verrà automaticamente
                            convertito in maiuscolo.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label">
                            Descrizione *
                        </label>

                        <input type="text"
                               id="name"
                               class="form-control"
                               th:field="*{name}"
                               maxlength="100"
                               placeholder="Es. Scatola"
                               required/>

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('name')}"
                             th:errors="*{name}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="symbol" class="form-label">
                            Simbolo *
                        </label>

                        <input type="text"
                               id="symbol"
                               class="form-control"
                               th:field="*{symbol}"
                               maxlength="20"
                               placeholder="Es. box"
                               required/>

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('symbol')}"
                             th:errors="*{symbol}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="dimension" class="form-label">
                            Dimensione *
                        </label>

                        <select id="dimension"
                                class="form-select"
                                th:field="*{dimension}"
                                required>

                            <option value="">
                                Seleziona una dimensione
                            </option>

                            <option th:each="dimension : ${dimensions}"
                                    th:value="${dimension}"
                                    th:text="${dimension}">
                                UNIT
                            </option>

                        </select>

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('dimension')}"
                             th:errors="*{dimension}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="decimalPlaces" class="form-label">
                            Numero di decimali *
                        </label>

                        <input type="number"
                               id="decimalPlaces"
                               class="form-control"
                               th:field="*{decimalPlaces}"
                               min="0"
                               max="6"
                               step="1"
                               required/>

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('decimalPlaces')}"
                             th:errors="*{decimalPlaces}">
                        </div>

                        <div class="muted">
                            Per unità indivisibili come PZ o BOX
                            utilizza normalmente 0 decimali.
                        </div>
                    </div>

                    <div class="page-header-right"
                         style="margin-top: 24px;">

                        <a class="btn btn-outline-secondary"
                           th:href="@{/warehouse/uoms}">
                            Annulla
                        </a>

                        <button type="submit"
                                class="btn btn-outline-primary">
                            <i class="bi bi-check-circle"></i>
                            Salva unità di misura
                        </button>

                    </div>

                </form>

            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: appFooter}"></div>

</div>
</body>
</html>
