<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="'Articolo ' + ${item.code}">Dettaglio articolo</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/layout :: appHeader}"></div>

  <main class="app-main">
    <div class="page">
      <div class="card">

        <div th:replace="~{fragments/layout :: flashMessages}"></div>

        <div class="breadcrumb">
          <a th:href="@{/dashboard}">Dashboard</a> /
          <a th:href="@{/items}">Articoli</a> /
          <span th:text="${item.code}">ART-001</span>
        </div>

        <div class="page-header">
          <div class="page-header-left">
            <h1 class="page-title" th:text="${item.name}">Articolo</h1>
            <div class="muted" th:text="${item.code}">ART-001</div>
          </div>
          <div class="page-header-right">
            <a class="btn btn-secondary" th:href="@{/items}">
              <i class="bi bi-arrow-left"></i>
              <span>Torna alla lista</span>
            </a>
            <a class="btn" th:href="@{/items/{id}/edit(id=${item.id})}">
              <i class="bi bi-pencil-square"></i>
              <span>Modifica</span>
            </a>
          </div>
        </div>

        <div class="info-grid">
          <div class="info-box">
            <div class="label">Codice</div>
            <div class="value" th:text="${item.code}">ART-001</div>
          </div>
          <div class="info-box">
            <div class="label">Tipo</div>
            <div class="value" th:text="${item.itemType}">PRODUCT</div>
          </div>
          <div class="info-box">
            <div class="label">Unità di misura</div>
            <div class="value" th:text="${item.unitOfMeasure}">pz</div>
          </div>
          <div class="info-box">
            <div class="label">Stock</div>
            <div class="value" th:text="${item.trackStock ? 'Gestito' : 'Non gestito'}">Gestito</div>
          </div>
        </div>

        <div class="info-grid">
          <div class="info-box">
            <div class="label">Prezzo base</div>
            <div class="value" th:text="${item.formattedBasePrice}">100,00 €</div>
          </div>
          <div class="info-box">
            <div class="label">IVA standard</div>
            <div class="value" th:text="${item.formattedDefaultTaxPct}">22,00%</div>
          </div>
          <div class="info-box">
            <div class="label">Stato</div>
            <div class="value" th:text="${item.active ? 'ACTIVE' : 'INACTIVE'}">ACTIVE</div>
          </div>
          <div class="info-box">
            <div class="label">Categoria logica</div>
            <div class="value" th:text="${item.itemType == 'PRODUCT' ? 'Articolo di magazzino' : 'Servizio'}">Articolo di magazzino</div>
          </div>
        </div>

        <div class="notes" th:if="${item.description != null and !#strings.isEmpty(item.description)}">
          <strong>Descrizione</strong><br/>
          <span th:text="${item.description}">Descrizione articolo</span>
        </div>

      </div>
    </div>
  </main>
  <div th:replace="~{fragments/layout :: appFooter}"></div>
</div>
</body>
</html>
