<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${formMode == 'create'} ? 'Nuovo articolo' : 'Modifica articolo'">Articolo</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: appHeader}"></div>

    <main class="app-main">
        <div class="page">
            <div class="card">
                <div th:replace="~{fragments/layout :: flashMessages}"></div>
                <div class="breadcrumb">
                    <a th:href="@{/dashboard}">Dashboard</a> /
                    <a th:href="@{/items}">Articoli</a> /
                    <span th:text="${formMode == 'create'} ? 'Nuovo articolo' : 'Modifica articolo'">Articolo</span>
                </div>

                <div class="page-header">
                    <div class="page-header-left">
                        <h1 class="page-title" th:text="${formMode == 'create'} ? 'Nuovo articolo' : 'Modifica articolo'">Articolo</h1>
                        <div class="muted">Anagrafica magazzino</div>
                    </div>
                    <div class="page-header-right">
                        <a class="btn btn-outline-secondary" th:href="@{/items}">
                            <i class="bi bi-arrow-left"></i>
                            <span>Torna alla lista</span>
                        </a>
                    </div>
                </div>

                <form th:action="${formMode == 'create'} ? @{/items} : @{/items/{id}(id=${itemId})}"
                      th:object="${itemForm}"
                      method="post">

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="form-grid">
                        <div class="form-field">
                            <label for="code">Codice</label>
                            <input id="code" type="text" th:field="*{code}" placeholder="ART-001"/>
                            <div class="field-error" th:if="${#fields.hasErrors('code')}" th:errors="*{code}">Errore</div>
                        </div>

                        <div class="form-field">
                            <label for="name">Nome</label>
                            <input id="name" type="text" th:field="*{name}" placeholder="Modulo CRM"/>
                            <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Errore</div>
                        </div>

                        <div class="form-field full">
                            <label for="description">Descrizione</label>
                            <textarea id="description" th:field="*{description}" rows="3" placeholder="Descrizione articolo o servizio"></textarea>
                            <div class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Errore</div>
                        </div>

                        <div class="form-field">
                            <label for="itemType">Tipo articolo</label>
                            <select id="itemType" th:field="*{itemType}">
                                <option value="">Seleziona</option>
                                <option value="PRODUCT">PRODUCT</option>
                                <option value="SERVICE">SERVICE</option>
                            </select>
                            <div class="field-error" th:if="${#fields.hasErrors('itemType')}" th:errors="*{itemType}">Errore</div>
                        </div>

                        <div class="form-field">
                            <label for="unitOfMeasure">Unità di misura</label>
                            <input id="unitOfMeasure" type="text" th:field="*{unitOfMeasure}" placeholder="pz"/>
                            <div class="field-error" th:if="${#fields.hasErrors('unitOfMeasure')}" th:errors="*{unitOfMeasure}">Errore</div>
                        </div>

                        <div class="form-field">
                            <label for="basePrice">Prezzo base</label>
                            <input id="basePrice" type="number" step="1" th:field="*{basePrice}" placeholder="0.00"/>
                            <div class="field-error" th:if="${#fields.hasErrors('basePrice')}" th:errors="*{basePrice}">Errore</div>
                        </div>

                        <div class="form-field">
                            <label for="defaultTaxPct">IVA standard %</label>
                            <input id="defaultTaxPct" type="number" step="1" th:field="*{defaultTaxPct}" placeholder="22.00"/>
                            <div class="field-error" th:if="${#fields.hasErrors('defaultTaxPct')}" th:errors="*{defaultTaxPct}">Errore</div>
                        </div>

                        <div class="form-field">
                            <label class="checkbox-field">
                                <input type="checkbox" th:field="*{active}"/>
                                <span>Articolo attivo</span>
                            </label>
                        </div>

                        <div class="form-field">
                            <label class="checkbox-field">
                                <input type="checkbox" th:field="*{trackStock}"/>
                                <span>Gestisci stock</span>
                            </label>
                        </div>
                    </div>

                    <div class="actions" style="margin-top: 24px;">
                        <button type="submit" class="btn btn-outline-primary">
                            <i class="bi bi-floppy"></i>
                            <span th:text="${formMode == 'create'} ? 'Crea articolo' : 'Salva modifiche'">Salva</span>
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: appFooter}"></div>
</div>
</body>
</html>
