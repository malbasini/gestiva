<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Nuova unità alternativa - Gestiva V2</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>

<body>
<div class="app-shell">

    <div th:replace="~{fragments/layout :: appHeader}"></div>

    <main class="app-main">
        <div class="page">
            <div class="card">

                <div th:replace="~{fragments/layout :: flashMessages}"></div>

                <div class="page-header">
                    <div class="page-header-left">
                        <h1 class="page-title">
                            Aggiungi unità alternativa
                        </h1>

                        <div class="muted">
                            Articolo:
                            <strong th:text="${item.code}">
                                TEST-ART-001
                            </strong>
                            —
                            <span th:text="${item.name}">
                                Radiatore di prova
                            </span>
                        </div>
                    </div>

                    <div class="page-header-right">
                        <a class="btn btn-outline-secondary"
                           th:href="@{/items/{id}(id=${item.id})}">
                            <i class="bi bi-arrow-left"></i>
                            Torna all'articolo
                        </a>
                    </div>
                </div>

                <div class="info-grid">
                    <div class="info-box">
                        <div class="label">Unità di misura base</div>
                        <div class="value"
                             th:text="${baseUom.code}">
                            PZ
                        </div>
                    </div>
                </div>

                <form th:action="@{/items/{id}/uoms(id=${item.id})}"
                      th:object="${itemUomForm}"
                      method="post">

                    <input type="hidden"
                           th:if="${_csrf != null}"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>

                    <div class="alert alert-danger"
                         th:if="${#fields.hasErrors('*')}">
                        Controlla i campi evidenziati.
                    </div>

                    <div class="mb-3">
                        <label for="uomId" class="form-label">
                            Unità alternativa *
                        </label>

                        <select id="uomId"
                                class="form-select"
                                th:field="*{uomId}"
                                required>

                            <option value="">
                                Seleziona un'unità
                            </option>

                            <option th:each="uom : ${availableUoms}"
                                    th:value="${uom.id}"
                                    th:text="${uom.code + ' - ' + uom.name}">
                                BOX - Scatola
                            </option>

                        </select>

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('uomId')}"
                             th:errors="*{uomId}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="conversionFactor" class="form-label">
                            Fattore di conversione *
                        </label>

                        <input type="number"
                               id="conversionFactor"
                               class="form-control"
                               th:field="*{conversionFactor}"
                               min="0.000001"
                               step="0.000001"
                               placeholder="Es. 10"
                               required/>

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('conversionFactor')}"
                             th:errors="*{conversionFactor}">
                        </div>

                        <div class="muted">
                            Indica quante unità base corrispondono
                            a 1 unità alternativa.
                            Esempio: 1 BOX = 10 PZ.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Utilizzo dell'unità
                        </label>

                        <div>
                            <label>
                                <input type="checkbox"
                                       th:field="*{purchaseUom}"/>
                                Utilizzabile negli acquisti
                            </label>
                        </div>

                        <div style="margin-top: 10px;">
                            <label>
                                <input type="checkbox"
                                       th:field="*{salesUom}"/>
                                Utilizzabile nelle vendite
                            </label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="barcode" class="form-label">
                            Barcode
                        </label>

                        <input type="text"
                               id="barcode"
                               class="form-control"
                               th:field="*{barcode}"
                               maxlength="100"
                               placeholder="Facoltativo"/>

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('barcode')}"
                             th:errors="*{barcode}">
                        </div>
                    </div>

                    <div class="page-header-right"
                         style="margin-top: 24px;">

                        <a class="btn btn-outline-secondary"
                           th:href="@{/items/{id}(id=${item.id})}">
                            Annulla
                        </a>

                        <button type="submit"
                                class="btn btn-outline-primary">
                            <i class="bi bi-check-circle"></i>
                            Salva conversione
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: appFooter}"></div>

</div>
</body>
</html>
