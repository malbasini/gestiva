<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Articoli</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/layout :: appHeader}"></div>

  <main class="app-main">
    <div class="page">
      <div class="card">

        <div th:replace="~{fragments/layout :: flashMessages}"></div>

        <div class="page-header">
          <div class="page-header-left">
            <h1 class="page-title">Articoli</h1>
            <div class="muted">Anagrafica prodotti e servizi</div>
          </div>
          <div class="page-header-right">
            <a th:href="@{/dashboard}" class="btn btn-outline-secondary" style="margin-right: 10px;">
              <i class="bi bi-speedometer"></i>
              <span>Dashboard</span>
            </a>
            <a class="btn btn-outline-success" th:href="@{/items/new}">
              <i class="bi bi-plus-lg"></i>
              <span>Nuovo articolo</span>
            </a>
          </div>
        </div>
        <form method="get" class="list-toolbar">
          <div class="toolbar-field search-field">
            <label for="q" class="form-label">Cerca</label>
            <input id="q"
                   name="q"
                   type="text"
                   class="form-control"
                   th:value="${q}"
                   placeholder="Codice, nome..."/>
          </div>
          <div class="toolbar-field">
            <label for="status" class="form-label">Stato</label>
            <select id="status" name="status" class="form-select">
              <option value="">Tutti</option>
              <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">Attivi</option>
              <option value="INACTIVE" th:selected="${status == 'INACTIVE'}">Non attivi</option>
            </select>
          </div>
          <div class="toolbar-field">
            <label for="size" class="form-label">Righe</label>
            <select id="size" name="size" class="form-select">
              <option value="10" th:selected="${size == 10}">10</option>
              <option value="20" th:selected="${size == 20}">20</option>
              <option value="50" th:selected="${size == 50}">50</option>
            </select>
          </div>
          <div class="toolbar-field toolbar-actions">
            <button type="submit" class="btn btn-secondary">
              <i class="bi bi-search"></i>
              <span>Cerca</span>
            </button>
            <a class="btn btn-secondary" th:href="@{/items}">
              <i class="bi bi-x-circle"></i>
              <span>Reset</span>
            </a>
          </div>
        </form>
        <table class="table">
          <thead>
          <tr>
            <th>ID</th>
            <th>Codice</th>
            <th>Nome</th>
            <th>Tipo</th>
            <th>UM</th>
            <th>Stock</th>
            <th>Prezzo</th>
            <th>IVA</th>
            <th>Stato</th>
            <th>Azioni</th>
          </tr>
          </thead>
          <tbody>
          <tr th:if="${#lists.isEmpty(items)}">
            <td colspan="10" class="muted">Nessun articolo trovato.</td>
          </tr>
          <tr th:each="item : ${items}">
            <td th:text="${item.id}">1</td>
            <td th:text="${item.code}">ART-001</td>
            <td th:text="${item.name}">Prodotto</td>
            <td th:text="${item.itemType}">PRODUCT</td>
            <td th:text="${item.unitOfMeasure}">pz</td>
            <td>
                            <span class="badge" th:classappend="${item.trackStock} ? ' badge-active' : ' badge-draft'"
                                  th:text="${item.trackStock ? 'TRACKED' : 'NO STOCK'}">TRACKED</span>
            </td>
            <td th:text="${item.formattedBasePrice}">100,00 €</td>
            <td th:text="${item.formattedDefaultTaxPct}">22,00%</td>
            <td>
                            <span class="badge" th:classappend="${item.active} ? ' badge-active' : ' badge-inactive'"
                                  th:text="${item.active ? 'ACTIVE' : 'INACTIVE'}">ACTIVE</span>
            </td>
            <td class="link-actions">
              <a th:href="@{/items/{id}(id=${item.id})}">
                <i class="bi bi-eye"></i>
                <span>Dettaglio</span>
              </a>
              <a th:href="@{/items/{id}/edit(id=${item.id})}">
                <i class="bi bi-pencil-square"></i>
                <span>Modifica</span>
              </a>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
      <div class="list-summary">
        <div class="muted">
          Totale risultati:
          <strong th:text="${page.totalElements}">0</strong>
        </div>
        <div class="pagination-wrap" th:if="${page.totalPages > 1}">
          <nav aria-label="Paginazione">
            <ul class="pagination pagination-sm mb-0">
              <li class="page-item" th:classappend="${page.first} ? ' disabled'">
                <a class="page-link"
                   th:href="${page.first} ? '#' : @{/items(page=${page.number - 1}, size=${size}, q=${q}, status=${status})}">
                  Precedente
                </a>
              </li>
              <li class="page-item"
                  th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                  th:classappend="${i == page.number} ? ' active'">
                <a class="page-link"
                   th:text="${i + 1}"
                   th:href="@{/items(page=${i}, size=${size}, q=${q}, status=${status})}">
                  1
                </a>
              </li>
              <li class="page-item" th:classappend="${page.last} ? ' disabled'">
                <a class="page-link"
                   th:href="${page.last} ? '#' : @{/items(page=${page.number + 1}, size=${size}, q=${q}, status=${status})}">
                  Successiva
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </div>
  </main>
  <div th:replace="~{fragments/layout :: appFooter}"></div>
</div>
</body>
</html>
