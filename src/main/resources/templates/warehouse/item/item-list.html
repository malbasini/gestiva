<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Articoli</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/layout :: appHeader}"></div>

  <main class="app-main">
    <div class="page">
      <div class="card">

        <div th:replace="~{fragments/layout :: flashMessages}"></div>

        <div class="breadcrumb">
          <a th:href="@{/dashboard}">Dashboard</a> /
          <span>Articoli</span>
        </div>

        <div class="page-header">
          <div class="page-header-left">
            <h1 class="page-title">Articoli</h1>
            <div class="muted">Anagrafica prodotti e servizi</div>
          </div>
          <div class="page-header-right">
            <a class="btn btn-primary" th:href="@{/items/new}">
              <i class="bi bi-plus-lg"></i>
              <span>Nuovo articolo</span>
            </a>
          </div>
        </div>

        <table class="table">
          <thead>
          <tr>
            <th>ID</th>
            <th>Codice</th>
            <th>Nome</th>
            <th>Tipo</th>
            <th>UM</th>
            <th>Stock</th>
            <th>Prezzo</th>
            <th>IVA</th>
            <th>Stato</th>
            <th>Azioni</th>
          </tr>
          </thead>
          <tbody>
          <tr th:if="${#lists.isEmpty(items)}">
            <td colspan="10" class="muted">Nessun articolo trovato.</td>
          </tr>
          <tr th:each="item : ${items}">
            <td th:text="${item.id}">1</td>
            <td th:text="${item.code}">ART-001</td>
            <td th:text="${item.name}">Prodotto</td>
            <td th:text="${item.itemType}">PRODUCT</td>
            <td th:text="${item.unitOfMeasure}">pz</td>
            <td>
                            <span class="badge" th:classappend="${item.trackStock} ? ' badge-active' : ' badge-draft'"
                                  th:text="${item.trackStock ? 'TRACKED' : 'NO STOCK'}">TRACKED</span>
            </td>
            <td th:text="${item.formattedBasePrice}">100,00 €</td>
            <td th:text="${item.formattedDefaultTaxPct}">22,00%</td>
            <td>
                            <span class="badge" th:classappend="${item.active} ? ' badge-active' : ' badge-inactive'"
                                  th:text="${item.active ? 'ACTIVE' : 'INACTIVE'}">ACTIVE</span>
            </td>
            <td class="link-actions">
              <a th:href="@{/items/{id}(id=${item.id})}">
                <i class="bi bi-eye"></i>
                <span>Dettaglio</span>
              </a>
              <a th:href="@{/items/{id}/edit(id=${item.id})}">
                <i class="bi bi-pencil-square"></i>
                <span>Modifica</span>
              </a>
            </td>
          </tr>
          </tbody>
        </table>

      </div>
    </div>
  </main>
  <div th:replace="~{fragments/layout :: appFooter}"></div>
</div>
</body>
</html>
