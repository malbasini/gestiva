<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Nuovo movimento di magazzino</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: appHeader}"></div>

    <main class="app-main">
        <div class="page">
            <div class="card">

                <div class="breadcrumb">
                    <a th:href="@{/dashboard}">Dashboard</a> /
                    <a th:href="@{/items}">Articoli</a> /
                    <a th:href="@{/items/{id}(id=${itemId})}">Dettaglio articolo</a> /
                    <span>Nuovo movimento</span>
                </div>

                <div class="page-header">
                    <div class="page-header-left">
                        <h1 class="page-title">Nuovo movimento di magazzino</h1>
                        <div class="muted">Carico o scarico manuale</div>
                    </div>
                    <div class="page-header-right">
                        <a class="btn btn-secondary" th:href="@{/items/{id}(id=${itemId})}">
                            <i class="bi bi-arrow-left"></i>
                            <span>Torna all'articolo</span>
                        </a>
                    </div>
                </div>

                <form th:action="@{/items/{itemId}/stock-movements(itemId=${itemId})}"
                      th:object="${stockMovementForm}"
                      method="post">

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="form-grid">
                        <div class="form-field">
                            <label for="movementDate">Data movimento</label>
                            <input id="movementDate" type="date" th:field="*{movementDate}"/>
                            <div class="field-error" th:if="${#fields.hasErrors('movementDate')}" th:errors="*{movementDate}">Errore</div>
                        </div>

                        <div class="form-field">
                            <label for="direction">Direzione</label>
                            <select id="direction" th:field="*{direction}">
                                <option value="IN">IN</option>
                                <option value="OUT">OUT</option>
                            </select>
                            <div class="field-error" th:if="${#fields.hasErrors('direction')}" th:errors="*{direction}">Errore</div>
                        </div>

                        <div class="form-field">
                            <label for="reasonCode">Causale</label>
                            <select id="reasonCode" th:field="*{reasonCode}">
                                <option value="MANUAL_LOAD">MANUAL_LOAD</option>
                                <option value="MANUAL_UNLOAD">MANUAL_UNLOAD</option>
                            </select>
                            <div class="field-error" th:if="${#fields.hasErrors('reasonCode')}" th:errors="*{reasonCode}">Errore</div>
                        </div>

                        <div class="form-field">
                            <label for="quantity">Quantità</label>
                            <input id="quantity" type="number" step="0.001" th:field="*{quantity}" placeholder="1.000"/>
                            <div class="field-error" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}">Errore</div>
                        </div>

                        <div class="form-field full">
                            <label for="notes">Note</label>
                            <textarea id="notes" th:field="*{notes}" rows="3" placeholder="Note opzionali"></textarea>
                        </div>
                    </div>

                    <div class="actions" style="margin-top:24px;">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-floppy"></i>
                            <span>Registra movimento</span>
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </main>
    <div th:replace="~{fragments/layout :: appFooter}"></div>
</div>
</body>
</html>
