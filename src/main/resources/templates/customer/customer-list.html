<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Clienti</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>
<body>
<div class="app-shell">

  <div th:replace="~{fragments/layout :: appHeader}"></div>

  <main class="app-main">
    <div class="page">
      <div class="card">

        <div class="breadcrumb">
          <a th:href="@{/dashboard(tenantId=${tenantId})}">Dashboard</a> /
          <span>Clienti</span>
        </div>

        <div class="page-header">
          <div class="page-header-left">
            <h1 class="page-title">Clienti</h1>
            <div class="muted">Gestione anagrafiche clienti</div>
          </div>

          <div class="page-header-right">
            <a class="btn btn-primary" th:href="@{/customers/new(tenantId=${tenantId})}">
              <i class="bi bi-plus-lg"></i>
              <span>Nuovo cliente</span>
            </a>
          </div>
        </div>

        <form method="get" class="list-toolbar">
          <div class="toolbar-field search-field">
            <label for="q" class="form-label">Cerca</label>
            <input id="q"
                   name="q"
                   type="text"
                   class="form-control"
                   th:value="${q}"
                   placeholder="nome, P.IVA, email..."/>
          </div>
          <div class="toolbar-field">
            <label for="status" class="form-label">Stato</label>
            <select id="status" name="status" class="form-select">
              <option value="">Tutti</option>
              <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">Attivi</option>
              <option value="INACTIVE" th:selected="${status == 'INACTIVE'}">Non attivi</option>
            </select>
          </div>

          <div class="toolbar-field">
            <label for="size" class="form-label">Righe</label>
            <select id="size" name="size" class="form-select">
              <option value="10" th:selected="${size == 10}">10</option>
              <option value="20" th:selected="${size == 20}">20</option>
              <option value="50" th:selected="${size == 50}">50</option>
            </select>
          </div>

          <div class="toolbar-field toolbar-actions">
            <button type="submit" class="btn btn-secondary">
              <i class="bi bi-search"></i>
              <span>Cerca</span>
            </button>
            <a class="btn btn-secondary" th:href="@{/customers}">
              <i class="bi bi-x-circle"></i>
              <span>Reset</span>
            </a>
          </div>
        </form>
        <table class="table">
          <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Email</th>
            <th>P.IVA</th>
            <th>Tipo</th>
            <th>Stato</th>
            <th>Azioni</th>
          </tr>
          </thead>
          <tbody>
          <tr th:if="${#lists.isEmpty(customersPage.content)}">
            <td colspan="7" class="muted">Nessun cliente trovato.</td>
          </tr>
          <tr th:each="customer : ${customersPage.content}">
            <td th:text="${customer.id}">1</td>
            <td th:text="${customer.name}">Rossi Srl</td>
            <td th:text="${customer.email}">rossi@example.com</td>
            <td th:text="${customer.vatNumber}">IT12345678901</td>
            <td th:text="${customer.type}">COMPANY</td>
            <td>
                            <span class="badge"
                                  th:classappend="${customer.status == 'ACTIVE'} ? ' badge-active' : ' badge-inactive'"
                                  th:text="${customer.status}">
                                ACTIVE
                            </span>
            </td>
            <td class="link-actions">
              <a th:href="@{/customers/{id}(id=${customer.id}, tenantId=${tenantId})}">
                <i class="bi bi-person-vcard"></i>
                <span>Dettaglio</span>
              </a>
              <a th:href="@{/quotes(customerId=${customer.id}, tenantId=${tenantId})}">
                <i class="bi bi-receipt"></i>
                <span>Preventivi</span>
              </a>
              <a th:href="@{/orders(customerId=${customer.id}, tenantId=${tenantId})}">
                <i class="bi bi-box-seam"></i>
                <span>Ordini</span>
              </a>
            </td>
          </tr>
          </tbody>
        </table>

        <div class="list-summary">
          <div class="muted">
            Totale risultati:
            <strong th:text="${page.totalElements}">0</strong>
          </div>
          <div class="pagination-wrap" th:if="${page.totalPages > 1}">
            <nav aria-label="Paginazione">
              <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${page.first} ? ' disabled'">
                  <a class="page-link"
                     th:href="${page.first} ? '#' : @{/customers(page=${page.number - 1}, size=${size}, q=${q}, status=${status})}">
                    Precedente
                  </a>
                </li>
                <li class="page-item"
                    th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                    th:classappend="${i == page.number} ? ' active'">
                  <a class="page-link"
                     th:text="${i + 1}"
                     th:href="@{/customers(page=${i}, size=${size}, q=${q}, status=${status})}">
                    1
                  </a>
                </li>
                <li class="page-item" th:classappend="${page.last} ? ' disabled'">
                  <a class="page-link"
                     th:href="${page.last} ? '#' : @{/customers(page=${page.number + 1}, size=${size}, q=${q}, status=${status})}">
                    Successiva
                  </a>
                </li>
              </ul>
            </nav>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div th:replace="~{fragments/layout :: appFooter}"></div>

</div>
</body>
</html>
