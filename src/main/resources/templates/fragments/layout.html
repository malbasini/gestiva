<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Gestiva</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>
<body>

<header th:fragment="appHeader" class="app-header">
    <div class="app-header-inner">
        <div class="app-brand">
            <a th:href="@{/dashboard}" class="brand-link">
                <span class="brand-mark">▣</span>
                <span class="brand-text">Gestiva</span>
            </a>
        </div>

        <nav class="top-nav">
            <a th:href="@{/dashboard}" th:classappend="${activeMenu == 'dashboard'} ? ' active' : ''">
                <i class="bi bi-speedometer2"></i>
                <span>Dashboard</span>
            </a>

            <a th:href="@{/customers}" th:classappend="${activeMenu == 'customers'} ? ' active' : ''">
                <i class="bi bi-people"></i>
                <span>Clienti</span>
            </a>

            <a th:href="@{/quotes}" th:classappend="${activeMenu == 'quotes'} ? ' active' : ''">
                <i class="bi bi-receipt"></i>
                <span>Preventivi</span>
            </a>

            <a th:href="@{/orders}" th:classappend="${activeMenu == 'orders'} ? ' active' : ''">
                <i class="bi bi-box-seam"></i>
                <span>Ordini</span>
            </a>

            <a th:href="@{/delivery-notes}" th:classappend="${activeMenu == 'ddt'} ? ' active' : ''">
                <i class="bi bi-truck"></i>
                <span>DDT</span>
            </a>

            <a th:href="@{/invoices}" th:classappend="${activeMenu == 'invoices'} ? ' active' : ''">
                <i class="bi bi-receipt-cutoff"></i>
                <span>Fatture</span>
            </a>
            <a th:href="@{/items}" th:classappend="${activeMenu == 'items'} ? ' active' : ''">
                <i class="bi bi-box2"></i>
                <span>Articoli</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            </a>
            </a>
            <div class="header-user-area" th:if="${currentUser != null}">
                <form th:action="@{/logout}" method="post" class="account-logout-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <span th:text="${currentUser.tenantName}"></span>&nbsp;
                    <button type="submit" class="btn btn-secondary btn-sm">
                        <i class="bi bi-box-arrow-right"></i>
                        <span>Logout</span>
                    </button>
                </form>
            </div>
            <br>
            <a th:href="@{/suppliers}" th:classappend="${activeMenu == 'suppliers'} ? ' active' : ''">
                <i class="bi bi-truck"></i>
                <span>Fornitori</span>
            </a>
            <a th:href="@{/purchase-orders}" th:classappend="${activeMenu == 'purchaseOrders'} ? ' active' : ''">
                <i class="bi bi-cart"></i>
                <span>Ordini acquisto</span>
            </a>
            <a th:href="@{/goods-receipts}" th:classappend="${activeMenu == 'goodsReceipts'} ? ' active' : ''">
                <i class="bi bi-box-arrow-in-down"></i>
                <span>Ricezioni merci</span>
            </a>
            <a th:href="@{/supplier-invoices}" th:classappend="${activeMenu == 'supplierInvoices'} ? ' active' : ''">
                <i class="bi bi-receipt"></i>
                <span>Fatture fornitore</span>
            </a>
            <a th:href="@{/payment-dues}" th:classappend="${activeMenu == 'paymentDues'} ? ' active' : ''">
                <i class="bi bi-calendar-check"></i>
                <span>Scadenzario</span>
            </a>
        </nav>
    </div>
</header>

<footer th:fragment="appFooter" class="app-footer">
    <div class="app-footer-inner" style="text-align: center">
        <span>⬢ Gestiva</span>
        <span>— gestionale modulare in sviluppo</span>
    </div>
</footer>

<div th:fragment="flashMessages">
    <div th:if="${successMessage}" class="alert alert-success">
        <span th:text="${successMessage}">Operazione completata con successo.</span>
    </div>

    <div th:if="${errorMessage}" class="alert alert-error">
        <span th:text="${errorMessage}">Si è verificato un errore.</span>
    </div>
</div>

</body>
</html>
