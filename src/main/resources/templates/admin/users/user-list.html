<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Utenti</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: appHeader}"></div>

    <main class="app-main">
        <div class="page">
            <div class="card">
                <div th:replace="~{fragments/layout :: flashMessages}"></div>

                <div class="page-header">
                    <div class="page-header-left">
                        <h1 class="page-title">Utenti e ruoli</h1>
                        <div class="muted">Gestione utenti del tenant</div>
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-lg-12">
                        <div class="table-wrap">
                            <table class="table">
                                <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>Email</th>
                                    <th>Ruoli</th>
                                    <th>Stato</th>
                                    <th>Azioni</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:if="${#lists.isEmpty(pageView.users)}">
                                    <td colspan="5" class="muted">Nessun utente presente.</td>
                                </tr>
                                <tr th:each="u : ${pageView.users}">
                                    <td th:text="${u.fullName}">Mario Rossi</td>
                                    <td th:text="${u.email}">mario@azienda.it</td>
                                    <td>
                                        <span th:text="${#strings.listJoin(u.roles, ', ')}">ROLE_ADMIN</span>
                                    </td>
                                    <td>
                    <span class="g-badge"
                          th:classappend="${u.active} ? ' g-badge-active' : ' g-badge-draft'"
                          th:text="${u.active} ? 'ATTIVO' : 'DISATTIVO'">
                      ATTIVO
                    </span>
                                    </td>
                                    <td class="link-actions">
                                        <a th:href="@{/admin/users/{id}/edit(id=${u.id})}">
                                            <i class="bi bi-pencil-square"></i>
                                            <span>Modifica</span>
                                        </a>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <br>
                    <hr>
                    <div class="col-lg-12">
                        <div class="card p-3">
                            <h2 class="h5 mb-3" th:text="${editMode} ? 'Modifica utente' : 'Nuovo utente'">Nuovo utente</h2>

                            <form method="post"
                                  th:action="${editMode} ? @{/admin/users/{id}/edit(id=${userForm.id})} : @{/admin/users/create}"
                                  th:object="${userForm}">

                                <div class="mb-3">
                                    <label class="form-label" for="firstName">Nome</label>
                                    <input id="firstName" type="text" class="form-control" th:field="*{firstName}"/>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label" for="lastName">Cognome</label>
                                    <input id="lastName" type="text" class="form-control" th:field="*{lastName}"/>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label" for="email">Email</label>
                                    <input id="email" type="email" class="form-control" th:field="*{email}"/>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label" for="password">Password</label>
                                    <input id="password" type="password" class="form-control" th:field="*{password}"/>
                                    <div class="muted mt-1" th:if="${editMode}">
                                        Lascia vuoto per non modificarla.
                                    </div>
                                </div>

                                <div class="form-check form-switch mb-3">
                                    <input id="active" class="form-check-input" type="checkbox" th:field="*{active}"/>
                                    <label class="form-check-label" for="active">Utente attivo</label>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Ruoli</label>
                                    <div th:each="role : ${pageView.availableRoles}" class="form-check">
                                        <input class="form-check-input"
                                               type="checkbox"
                                               th:field="*{roles}"
                                               th:value="${role}"
                                               th:id="${'role_' + role}"/>
                                        <label class="form-check-label"
                                               th:for="${'role_' + role}"
                                               th:text="${role}">
                                            ROLE_ADMIN
                                        </label>
                                    </div>
                                </div>

                                <div class="d-flex gap-2 flex-wrap">
                                    <button type="submit" class="btn btn-outline-primary">
                                        <i class="bi bi-check2-circle"></i>
                                        <span th:text="${editMode} ? 'Salva modifiche' : 'Crea utente'">Crea utente</span>
                                    </button>

                                    <a th:if="${editMode}" class="btn btn-outline-secondary" th:href="@{/admin/users}">
                                        <i class="bi bi-x-circle"></i>
                                        <span>Annulla</span>
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: appFooter}"></div>
</div>
</body>
</html>
