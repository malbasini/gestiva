<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Pagina non trovata - Gestiva</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .error-403-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
    }
    .error-403-card {
      max-width: 600px;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      background: #ffffff;
      text-align: center;
    }
    .error-code {
      font-size: 4rem;
      font-weight: 700;
      color: #dc3545;
      margin-bottom: 0.5rem;
    }
    .error-title {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
    .error-message {
      color: #666;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
<main class="error-403-container">
  <div class="error-403-card">
    <div class="error-code">404</div>
    <h1 class="error-title">Pagina non trovata</h1>

    <p class="error-message">
      La pagina richiesta non esiste oppure non è più disponibile.
    </p>
    <div class="d-flex justify-content-center gap-2">
      <a th:href="@{/dashboard}" class="btn btn-outline-primary">
        Torna alla dashboard
      </a>
      <button type="button" class="btn btn-outline-secondary" onclick="history.back()">
        Indietro
      </button>
    </div>
  </div>
</main>
</body>
</html>
