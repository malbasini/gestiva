<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Modifica società - Gestiva</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>
<body>
<div class="app-shell">

    <div th:replace="~{fragments/layout :: appHeader}"></div>

    <main class="app-main">
        <div class="page">
            <div class="card">

                <div th:replace="~{fragments/layout :: flashMessages}"></div>

                <div class="page-header">
                    <div class="page-header-left">
                        <h1 class="page-title">
                            <i class="bi bi-pencil-square"></i>
                            Modifica società
                        </h1>
                        <div class="muted">
                            Modifica i dati amministrativi della società.
                        </div>
                    </div>
                </div>

                <div th:if="${errorMessage != null}"
                     class="alert alert-danger"
                     role="alert"
                     th:text="${errorMessage}">
                </div>

                <form method="post"
                      th:action="@{/settings/companies/{id}/edit(id=${company.id})}"
                      th:object="${companyEditForm}">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>

                    <div class="form-grid">

                        <div class="form-field">
                            <label for="code">Codice società</label>
                            <input id="code"
                                   class="form-control"
                                   type="text"
                                   th:value="${company.code}"
                                   readonly/>
                            <div class="muted">
                                Il codice identificativo non può essere modificato.
                            </div>
                        </div>

                        <div class="form-field">
                            <label for="legalName">Ragione sociale</label>
                            <input id="legalName"
                                   class="form-control"
                                   type="text"
                                   maxlength="180"
                                   required
                                   th:field="*{legalName}"/>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('legalName')}"
                                 th:errors="*{legalName}">
                            </div>
                        </div>

                        <div class="form-field">
                            <label for="active">Stato società</label>

                            <label style="display:flex;align-items:center;gap:10px;">
                                <input id="active"
                                       type="checkbox"
                                       th:field="*{active}"/>
                                <span>Società attiva</span>
                            </label>

                            <div class="muted">
                                Una società inattiva non sarà selezionabile
                                dagli utenti per le operazioni aziendali.
                            </div>
                        </div>

                    </div>

                    <div class="actions" style="margin-top:24px;">

                        <button type="submit" class="btn btn-outline-primary">
                            <i class="bi bi-check2-circle"></i>
                            <span>Salva modifiche</span>
                        </button>

                        <a class="btn btn-outline-secondary"
                           th:href="@{/settings/companies}">
                            <i class="bi bi-arrow-left"></i>
                            <span>Annulla</span>
                        </a>

                    </div>

                </form>

            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: appFooter}"></div>

</div>
</body>
</html>
