<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Gestione società - Gestiva</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>
<body>
<div class="app-shell">

    <div th:replace="~{fragments/layout :: appHeader}"></div>

    <main class="app-main">
        <div class="page">
            <div class="card">

                <div th:replace="~{fragments/layout :: flashMessages}"></div>

                <div class="page-header">
                    <div class="page-header-left">
                        <h1 class="page-title">
                            <i class="bi bi-buildings"></i>
                            Gestione società
                        </h1>
                        <div class="muted">
                            Elenco delle società appartenenti alla tua organizzazione
                        </div>
                    </div>

                    <div class="actions">
                        <a class="btn btn-outline-primary"
                           th:href="@{/settings/companies/new}">
                            <i class="bi bi-plus-circle"></i>
                            <span>Nuova società</span>
                        </a>
                    </div>
                </div>

                <div class="table-wrap">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>Codice</th>
                            <th>Ragione sociale</th>
                            <th>Nome commerciale</th>
                            <th>Paese</th>
                            <th>Valuta</th>
                            <th>Stato</th>
                            <th>Azioni</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="company : ${companies}">
                            <td>
                                <strong th:text="${company.code}">MAIN</strong>
                            </td>

                            <td th:text="${company.legalName}">
                                Società principale
                            </td>

                            <td th:text="${company.tradeName != null
                                    ? company.tradeName : '-'}">
                                -
                            </td>

                            <td th:text="${company.countryCode}">
                                IT
                            </td>

                            <td th:text="${company.currencyCode}">
                                EUR
                            </td>

                            <td>
                                <span th:if="${company.active}"
                                      style="color:#198754;font-weight:600;">
                                    <i class="bi bi-check-circle"></i>
                                    Attiva
                                </span>

                                <span th:unless="${company.active}"
                                      style="color:#6c757d;font-weight:600;">
                                    <i class="bi bi-dash-circle"></i>
                                    Inattiva
                                </span>
                            </td>

                            <td>
                                <a class="btn btn-outline-primary"
                                   th:href="@{/settings/companies/{id}/edit(id=${company.id})}">
                                    <i class="bi bi-pencil-square"></i>
                                    <span>Modifica</span>
                                </a>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(companies)}">
                            <td colspan="7"
                                class="muted"
                                style="text-align:center;padding:24px;">
                                Nessuna società disponibile.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="muted" style="margin-top:16px;">
                    <span th:text="${#lists.size(companies)}">0</span>
                    società presenti nell'organizzazione.
                </div>

            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: appFooter}"></div>

</div>
</body>
</html>
