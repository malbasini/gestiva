<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Nuova società - Gestiva</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>
<body>
<div class="app-shell">

    <div th:replace="~{fragments/layout :: appHeader}"></div>

    <main class="app-main">
        <div class="page">
            <div class="card">

                <div th:replace="~{fragments/layout :: flashMessages}"></div>

                <div class="page-header">
                    <div class="page-header-left">
                        <h1 class="page-title">
                            <i class="bi bi-building-add"></i>
                            Nuova società
                        </h1>
                        <div class="muted">
                            Crea una nuova società nella tua organizzazione.
                        </div>
                    </div>
                </div>

                <div th:if="${errorMessage != null}"
                     class="alert alert-danger"
                     role="alert"
                     th:text="${errorMessage}">
                </div>

                <form method="post"
                      th:action="@{/settings/companies/new}"
                      th:object="${companyCreateForm}">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>

                    <div class="form-grid">

                        <div class="form-field">
                            <label for="code">Codice società</label>
                            <input id="code"
                                   type="text"
                                   class="form-control"
                                   maxlength="30"
                                   required
                                   th:field="*{code}"
                                   placeholder="Esempio: ROSSI02"/>

                            <div class="muted">
                                Identificativo univoco all'interno del tenant.
                            </div>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('code')}"
                                 th:errors="*{code}">
                            </div>
                        </div>

                        <div class="form-field">
                            <label for="legalName">Ragione sociale</label>
                            <input id="legalName"
                                   type="text"
                                   class="form-control"
                                   maxlength="180"
                                   required
                                   th:field="*{legalName}"
                                   placeholder="Ragione sociale completa"/>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('legalName')}"
                                 th:errors="*{legalName}">
                            </div>
                        </div>

                    </div>

                    <div class="muted" style="margin-top:20px;">
                        Alla creazione verranno inizializzati automaticamente
                        le impostazioni aziendali, i numeratori documentali
                        e il piano dei conti.
                    </div>

                    <div class="actions" style="margin-top:24px;">

                        <button type="submit" class="btn btn-outline-primary">
                            <i class="bi bi-check2-circle"></i>
                            <span>Crea società</span>
                        </button>

                        <a class="btn btn-outline-secondary"
                           th:href="@{/settings/companies}">
                            <i class="bi bi-arrow-left"></i>
                            <span>Annulla</span>
                        </a>

                    </div>

                </form>

            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: appFooter}"></div>

</div>
</body>
</html>
