<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Impostazioni azienda</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: appHeader}"></div>

    <main class="app-main">
        <div class="page">
            <div class="card">
                <div th:replace="~{fragments/layout :: flashMessages}"></div>

                <div class="page-header">
                    <div class="page-header-left">
                        <h1 class="page-title">Impostazioni azienda</h1>
                        <div class="muted">Dati azienda, numeratori documenti e parametri base</div>
                    </div>
                </div>

                <form method="post" th:object="${companySettingsForm}">
                    <h2 class="page-title" style="font-size:1.1rem; margin-top:10px;">Dati azienda</h2>

                    <div class="form-grid">
                        <div class="form-field">
                            <label for="companyName">Ragione sociale</label>
                            <input id="companyName" class="form-control" type="text" th:field="*{companyName}"/>
                        </div>

                        <div class="form-field">
                            <label for="tradeName">Nome commerciale</label>
                            <input id="tradeName" class="form-control" type="text" th:field="*{tradeName}"/>
                        </div>

                        <div class="form-field">
                            <label for="vatNumber">Partita IVA</label>
                            <input id="vatNumber" class="form-control" type="text" th:field="*{vatNumber}"/>
                        </div>

                        <div class="form-field">
                            <label for="taxCode">Codice fiscale</label>
                            <input id="taxCode" class="form-control" type="text" th:field="*{taxCode}"/>
                        </div>

                        <div class="form-field">
                            <label for="email">Email</label>
                            <input id="email" class="form-control" type="text" th:field="*{email}"/>
                        </div>

                        <div class="form-field">
                            <label for="phone">Telefono</label>
                            <input id="phone" class="form-control" type="text" th:field="*{phone}"/>
                        </div>

                        <div class="form-field">
                            <label for="website">Sito web</label>
                            <input id="website" class="form-control" type="text" th:field="*{website}"/>
                        </div>

                        <div class="form-field full">
                            <label for="addressLine1">Indirizzo</label>
                            <input id="addressLine1" class="form-control" type="text" th:field="*{addressLine1}"/>
                        </div>

                        <div class="form-field">
                            <label for="postalCode">CAP</label>
                            <input id="postalCode" class="form-control" type="text" th:field="*{postalCode}"/>
                        </div>

                        <div class="form-field">
                            <label for="city">Città</label>
                            <input id="city" class="form-control" type="text" th:field="*{city}"/>
                        </div>

                        <div class="form-field">
                            <label for="province">Provincia</label>
                            <input id="province" class="form-control" type="text" th:field="*{province}"/>
                        </div>

                        <div class="form-field">
                            <label for="countryCode">Paese</label>
                            <input id="countryCode" class="form-control" type="text" th:field="*{countryCode}" placeholder="IT"/>
                        </div>
                    </div>

                    <h2 class="page-title" style="font-size:1.1rem; margin-top:24px;">Parametri base</h2>

                    <div class="form-grid">
                        <div class="form-field">
                            <label for="defaultCurrencyCode">Valuta predefinita</label>
                            <input id="defaultCurrencyCode" class="form-control" type="text" th:field="*{defaultCurrencyCode}" placeholder="EUR"/>
                        </div>

                        <div class="form-field">
                            <label for="defaultVatPct">Aliquota IVA predefinita</label>
                            <input id="defaultVatPct" class="form-control" type="number" step="0.01" th:field="*{defaultVatPct}"/>
                        </div>

                        <div class="form-field">
                            <label for="defaultCustomerDueDays">Scadenza default clienti (giorni)</label>
                            <input id="defaultCustomerDueDays" class="form-control" type="number" th:field="*{defaultCustomerDueDays}"/>
                        </div>

                        <div class="form-field">
                            <label for="defaultSupplierDueDays">Scadenza default fornitori (giorni)</label>
                            <input id="defaultSupplierDueDays" class="form-control" type="number" th:field="*{defaultSupplierDueDays}"/>
                        </div>
                    </div>

                    <h2 class="page-title" style="font-size:1.1rem; margin-top:24px;">Numeratori documenti</h2>

                    <div class="table-wrap">
                        <table class="table">
                            <thead>
                            <tr>
                                <th>Tipo documento</th>
                                <th>Prefisso</th>
                                <th>Prossimo numero</th>
                                <th>Padding</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="seq, stat : *{sequences}">
                                <td>
                                    <input type="hidden" th:field="*{sequences[__${stat.index}__].documentType}"/>
                                    <span th:text="*{sequences[__${stat.index}__].documentType}">SALES_INVOICE</span>
                                </td>
                                <td>
                                    <input class="form-control" type="text" th:field="*{sequences[__${stat.index}__].prefix}"/>
                                </td>
                                <td>
                                    <input class="form-control" type="number" th:field="*{sequences[__${stat.index}__].nextNumber}"/>
                                </td>
                                <td>
                                    <input class="form-control" type="number" th:field="*{sequences[__${stat.index}__].paddingSize}"/>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="actions" style="margin-top:24px;">
                        <button type="submit" class="btn btn-outline-primary">
                            <i class="bi bi-check2-circle"></i>
                            <span>Salva impostazioni</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: appFooter}"></div>
</div>
</body>
</html>
