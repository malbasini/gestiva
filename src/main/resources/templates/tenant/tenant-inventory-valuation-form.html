<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Metodo valorizzazione magazzino</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/layout :: appHeader}"></div>

  <main class="app-main">
    <div class="page" style="max-width: 900px;">
      <div class="card">
        <div th:replace="~{fragments/layout :: flashMessages}"></div>

        <div class="page-header">
          <div class="page-header-left">
            <h1 class="page-title">Metodo valorizzazione magazzino</h1>
            <div class="muted">Configurazione del criterio di valorizzazione del tenant</div>
          </div>
          <div class="page-header-right">
            <a class="btn btn-secondary" th:href="@{/items}">
              <i class="bi bi-arrow-left"></i>
              <span>Torna agli articoli</span>
            </a>
          </div>
        </div>

        <form th:action="@{/tenant-settings/inventory-valuation}"
              th:object="${tenantInventoryValuationForm}"
              method="post">

          <div class="form-grid">
            <div class="form-field full">
              <label for="inventoryValuationMethod">Metodo valorizzazione</label>
              <select id="inventoryValuationMethod" class="form-select" th:field="*{inventoryValuationMethod}">
                <option value="FIFO">FIFO</option>
                <option value="LIFO">LIFO</option>
                <option value="AVERAGE">AVERAGE</option>
              </select>
              <div class="field-error"
                   th:if="${#fields.hasErrors('inventoryValuationMethod')}"
                   th:errors="*{inventoryValuationMethod}">
                Errore metodo valorizzazione
              </div>
            </div>
          </div>

          <div class="notes" style="margin-top:20px;">
            <strong>Nota:</strong>
            il metodo selezionato si applica ai <strong>movimenti futuri</strong>.
            Le valorizzazioni già registrate non vengono ricalcolate automaticamente.
          </div>

          <div class="actions" style="margin-top:24px;">
            <button type="submit" class="btn btn-outline-primary">
              <i class="bi bi-check2-circle"></i>
              <span>Salva</span>
            </button>

            <a class="btn btn-outline-secondary" th:href="@{/items}">
              <i class="bi bi-x-circle"></i>
              <span>Annulla</span>
            </a>
          </div>
        </form>
      </div>
    </div>
  </main>
  <div th:replace="~{fragments/layout :: appFooter}"></div>
</div>
</body>
</html>
