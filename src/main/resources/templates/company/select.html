<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Seleziona società - Gestiva</title>
    <meta name="description" content="Selezione della società operativa.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: appHeader}"></div>
    <main class="app-main">
        <div class="page">
            <div th:replace="~{fragments/layout :: flashMessages}"></div>
            <div class="page-header">
                <div class="page-header-left">
                    <h1 class="page-title">
                        Seleziona società
                    </h1>
                    <div class="muted">
                        Scegli la società sulla quale desideri lavorare.
                    </div>
                </div>
            </div>
            <div class="card p-3">
                <div th:if="${#lists.isEmpty(companies)}"
                     class="alert alert-warning">
                    Non risultano società disponibili per il tuo utente.
                </div>
                <div th:each="company : ${companies}"
                     class="border rounded p-3 mb-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h2 class="h5 mb-1"
                                th:text="${company.legalName}">
                                Nome società
                            </h2>
                            <span class="badge bg-success"
                                  th:if="${activeCompanyId != null and activeCompanyId == company.id}">
                                Società attiva
                            </span>
                        </div>
                        <form th:action="@{/company/select}"
                              method="post">
                            <input type="hidden"
                                   name="companyId"
                                   th:value="${company.id}"/>
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>
                            <button type="submit"
                                    class="btn btn-primary">
                                <i class="bi bi-check-circle"></i>
                                Seleziona
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="mt-3">
                <a th:href="@{/dashboard}"
                   class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i>
                    Torna alla dashboard
                </a>
            </div>
        </div>
    </main>
</div>
</body>
</html>
