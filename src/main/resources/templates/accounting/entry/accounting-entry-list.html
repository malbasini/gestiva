<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Prima nota</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: appHeader}"></div>

    <main class="app-main">
        <div class="page">
            <div class="card">
                <div th:replace="~{fragments/layout :: flashMessages}"></div>

                <div class="breadcrumb">
                    <a th:href="@{/dashboard}">Dashboard</a> /
                    <span>Prima nota</span>
                </div>

                <div class="page-header">
                    <div class="page-header-left">
                        <h1 class="page-title">Prima nota</h1>
                        <div class="muted">Movimenti contabili gestionali della V1</div>
                    </div>
                    <div class="page-header-right">
                        <a class="btn btn-primary" th:href="@{/accounting-entries/new}">
                            <i class="bi bi-plus-lg"></i>
                            <span>Nuova registrazione</span>
                        </a>
                    </div>
                </div>

                <table class="table">
                    <thead>
                    <tr>
                        <th>Numero</th>
                        <th>Data</th>
                        <th>Causale</th>
                        <th>Descrizione</th>
                        <th class="text-right">Totale</th>
                        <th>Riferimento</th>
                        <th>Azioni</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(entries)}">
                        <td colspan="7" class="muted">Nessun movimento di prima nota trovato.</td>
                    </tr>
                    <tr th:each="entry : ${entries}">
                        <td th:text="${entry.entryNumber}">PN-00001</td>
                        <td th:text="${entry.formattedEntryDate}">09/05/2026</td>
                        <td th:text="${entry.causalCode}">CUSTOMER_RECEIPT</td>
                        <td th:text="${entry.description}">Incasso su scadenza INV-001</td>
                        <td class="text-right" th:text="${entry.formattedTotalAmount}">100,00 €</td>
                        <td th:text="${entry.referenceType != null ? entry.referenceType : '-'}">PAYMENT_DUE</td>
                        <td class="link-actions">
                            <a th:href="@{/accounting-entries/{id}(id=${entry.id})}">
                                <i class="bi bi-eye"></i>
                                <span>Dettaglio</span>
                            </a>

                            <a th:if="${entry.referenceType == 'PAYMENT_DUE' and entry.referenceId != null}"
                               th:href="@{/payment-dues/{id}(id=${entry.referenceId})}">
                                <i class="bi bi-calendar-check"></i>
                                <span>Scadenza</span>
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <div th:replace="~{fragments/layout :: appFooter}"></div>
</div>
</body>
</html>
