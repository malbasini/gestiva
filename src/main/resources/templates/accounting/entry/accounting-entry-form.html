<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Nuova registrazione manuale</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/layout :: appHeader}"></div>

  <main class="app-main">
    <div class="page">
      <div class="card">
        <div th:replace="~{fragments/layout :: flashMessages}"></div>
        <div class="page-header">
          <div class="page-header-left">
            <h1 class="page-title">Nuova registrazione manuale</h1>
            <div class="muted">Entrata o uscita non collegata direttamente a documenti</div>
          </div>
          <div class="page-header-right">
            <a class="btn btn-outline-secondary" th:href="@{/accounting-entries}">
              <i class="bi bi-arrow-left"></i>
              <span>Torna alla lista</span>
            </a>
          </div>
        </div>

        <form method="post" th:action="@{/accounting-entries}" th:object="${manualForm}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <div class="form-grid">
            <div class="form-field">
              <label for="entryDate">Data registrazione</label>
              <input id="entryDate"
                     type="date"
                     name="entryDate"
                     th:value="${manualForm.entryDate != null ? #temporals.format(manualForm.entryDate, 'yyyy-MM-dd') : ''}"/>
              <div class="field-error" th:if="${#fields.hasErrors('entryDate')}" th:errors="*{entryDate}">Errore</div>
            </div>

            <div class="form-field">
              <label for="movementType">Tipo movimento</label>
              <select id="movementType" th:field="*{movementType}">
                <option value="MANUAL_INCOME">Entrata manuale</option>
                <option value="MANUAL_EXPENSE">Uscita manuale</option>
              </select>
              <div class="field-error" th:if="${#fields.hasErrors('movementType')}" th:errors="*{movementType}">Errore</div>
            </div>

            <div class="form-field full">
              <label for="description">Descrizione</label>
              <input id="description" type="text" th:field="*{description}" placeholder="Descrizione movimento"/>
              <div class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Errore</div>
            </div>

            <div class="form-field">
              <label for="amount">Importo</label>
              <input id="amount" type="number" step="1" th:field="*{amount}" placeholder="0.00"/>
              <div class="field-error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}">Errore</div>
            </div>

            <div class="form-field">
              <label for="currencyCode">Valuta</label>
              <input id="currencyCode" type="text" th:field="*{currencyCode}" placeholder="EUR"/>
              <div class="field-error" th:if="${#fields.hasErrors('currencyCode')}" th:errors="*{currencyCode}">Errore</div>
            </div>

            <div class="form-field full">
              <label for="notes">Note</label>
              <textarea id="notes" th:field="*{notes}" rows="4" placeholder="Note aggiuntive"></textarea>
            </div>
          </div>

          <div class="actions" style="margin-top:20px;">
            <button type="submit" class="btn btn-outline-primary">
              <i class="bi bi-floppy"></i>
              <span>Salva registrazione</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>
  <div th:replace="~{fragments/layout :: appFooter}"></div>
</div>
</body>
</html>
