<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Liquidazione IVA mensile</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/layout :: appHeader}"></div>

  <main class="app-main">
    <div class="page">
      <div class="card">
        <div th:replace="~{fragments/layout :: flashMessages}"></div>

        <div class="page-header">
          <div class="page-header-left">
            <h1 class="page-title">Liquidazione IVA mensile</h1>
            <div class="muted">Riepilogo IVA vendite, acquisti e saldo del periodo</div>
          </div>
        </div>

        <form method="get" class="row g-3 align-items-end">
          <div class="col-md-3">
            <label for="year" class="form-label">Anno</label>
            <input id="year" name="year" type="number" class="form-control" th:value="${selectedYear}"/>
          </div>

          <div class="col-md-3">
            <label for="month" class="form-label">Mese</label>
            <select id="month" name="month" class="form-select">
              <option th:each="m : ${#numbers.sequence(1, 12)}"
                      th:value="${m}"
                      th:text="${m}"
                      th:selected="${m == selectedMonth}">
                1
              </option>
            </select>
          </div>

          <div class="col-md-6">
            <button type="submit" class="btn btn-outline-primary">
              <i class="bi bi-search"></i>
              <span>Calcola</span>
            </button>

            <a class="btn btn-outline-secondary" th:href="@{/vat-registers/settlement}">
              <i class="bi bi-x-circle"></i>
              <span>Reset</span>
            </a>
          </div>
        </form>

        <div class="info-grid three-cols" style="margin-top:24px;">
          <div class="info-box">
            <div class="label">Imponibile vendite</div>
            <div class="value" th:text="${settlement.formattedSalesTaxableAmount}">0,00</div>
          </div>
          <div class="info-box">
            <div class="label">IVA vendite</div>
            <div class="value" th:text="${settlement.formattedSalesTaxAmount}">0,00</div>
          </div>
          <div class="info-box">
            <div class="label">Totale periodo</div>
            <div class="value" th:text="${settlement.year + ' / ' + settlement.month}">2026 / 5</div>
          </div>
        </div>

        <div class="info-grid three-cols" style="margin-top:20px;">
          <div class="info-box">
            <div class="label">Imponibile acquisti</div>
            <div class="value" th:text="${settlement.formattedPurchaseTaxableAmount}">0,00</div>
          </div>
          <div class="info-box">
            <div class="label">IVA acquisti</div>
            <div class="value" th:text="${settlement.formattedPurchaseTaxAmount}">0,00</div>
          </div>
          <div class="info-box">
            <div class="label">Saldo IVA</div>
            <div class="value" th:text="${settlement.formattedVatBalance}">0,00</div>
          </div>
        </div>

        <div class="notes" style="margin-top:20px;">
          <strong>Esito liquidazione:</strong>
          <span th:text="${settlement.balanceTypeLabel}">A DEBITO</span>
        </div>

      </div>
    </div>
  </main>

  <div th:replace="~{fragments/layout :: appFooter}"></div>
</div>
</body>
</html>
