<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Registro IVA vendite</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/layout :: appHeader}"></div>

  <main class="app-main">
    <div class="page">
      <div class="card">
        <div th:replace="~{fragments/layout :: flashMessages}"></div>

        <div class="page-header">
          <div class="page-header-left">
            <h1 class="page-title">Registro IVA vendite</h1>
            <div class="muted">Riepilogo IVA fatture clienti per periodo e aliquota</div>
          </div>
        </div>

        <form method="get" class="row g-3 align-items-end">
          <div class="col-md-3">
            <label for="dateFrom" class="form-label">Dal</label>
            <input id="dateFrom" name="dateFrom" type="date" class="form-control" th:value="${dateFrom}"/>
          </div>

          <div class="col-md-3">
            <label for="dateTo" class="form-label">Al</label>
            <input id="dateTo" name="dateTo" type="date" class="form-control" th:value="${dateTo}"/>
          </div>

          <div class="col-md-6">
            <button type="submit" class="btn btn-outline-primary">
              <i class="bi bi-search"></i>
              <span>Cerca</span>
            </button>

            <a class="btn btn-outline-secondary" th:href="@{/vat-registers/sales}">
              <i class="bi bi-x-circle"></i>
              <span>Reset</span>
            </a>
          </div>
        </form>

        <div class="table-wrap" style="margin-top:20px;">
          <table class="table">
            <thead>
            <tr>
              <th>Data</th>
              <th>Numero fattura</th>
              <th>Cliente</th>
              <th class="text-right">Aliquota</th>
              <th class="text-right">Imponibile</th>
              <th class="text-right">IVA</th>
              <th class="text-right">Totale</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(rows)}">
              <td colspan="7" class="muted">Nessun movimento IVA vendite nel periodo selezionato.</td>
            </tr>

            <tr th:each="row : ${rows}">
              <td th:text="${row.formattedInvoiceDate}">24/05/2026</td>
              <td th:text="${row.invoiceNumber}">INV-2026-00005</td>
              <td th:text="${row.customerName}">Bianchi Srl</td>
              <td class="text-right" th:text="${row.formattedTaxPct}">22,00%</td>
              <td class="text-right" th:text="${row.formattedTaxableAmount}">100,00</td>
              <td class="text-right" th:text="${row.formattedTaxAmount}">22,00</td>
              <td class="text-right" th:text="${row.formattedTotalAmount}">122,00</td>
            </tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </main>

  <div th:replace="~{fragments/layout :: appFooter}"></div>
</div>
</body>
</html>
