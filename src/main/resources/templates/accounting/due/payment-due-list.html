<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Scadenzario</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/layout :: appHeader}"></div>

  <main class="app-main">
    <div class="page">
      <div class="card">
        <div th:replace="~{fragments/layout :: flashMessages}"></div>

        <div class="breadcrumb">
          <a th:href="@{/dashboard}">Dashboard</a> /
          <span>Scadenzario</span>
        </div>

        <div class="page-header">
          <div class="page-header-left">
            <h1 class="page-title">Scadenzario</h1>
            <div class="muted">Incassi e pagamenti attesi</div>
          </div>
        </div>

        <form method="get" th:action="@{/payment-dues}" class="filters">
          <select name="direction">
            <option value="" th:selected="${selectedDirection == null or selectedDirection == ''}">Tutte</option>
            <option value="RECEIVABLE" th:selected="${selectedDirection == 'RECEIVABLE'}">Da incassare</option>
            <option value="PAYABLE" th:selected="${selectedDirection == 'PAYABLE'}">Da pagare</option>
          </select>

          <select name="openOnly">
            <option value="true" th:selected="${openOnly}">Solo aperte</option>
            <option value="false" th:selected="${!openOnly}">Tutte</option>
          </select>

          <button type="submit" class="btn btn-secondary">
            <i class="bi bi-funnel"></i>
            <span>Filtra</span>
          </button>
        </form>

        <table class="table">
          <thead>
          <tr>
            <th>Tipo</th>
            <th>Controparte</th>
            <th>Documento</th>
            <th>Data doc.</th>
            <th>Scadenza</th>
            <th class="text-right">Importo</th>
            <th class="text-right">Pagato</th>
            <th class="text-right">Residuo</th>
            <th>Stato</th>
            <th>Azioni</th>
          </tr>
          </thead>
          <tbody>
          <tr th:if="${#lists.isEmpty(dues)}">
            <td colspan="10" class="muted">Nessuna scadenza trovata.</td>
          </tr>

          <tr th:each="due : ${dues}">
            <td>
                            <span class="badge"
                                  th:classappend="${due.direction == 'RECEIVABLE'} ? ' badge-confirmed' : ' badge-draft'"
                                  th:text="${due.direction == 'RECEIVABLE'} ? 'INCASSO' : 'PAGAMENTO'">
                                INCASSO
                            </span>
            </td>
            <td th:text="${due.partyName}">Cliente / Fornitore</td>
            <td th:text="${due.documentNumber}">INV-001</td>
            <td th:text="${due.formattedDocumentDate}">08/05/2026</td>
            <td>
              <span th:text="${due.formattedDueDate}">07/06/2026</span>
              <span class="badge badge-cancelled" th:if="${due.overdue}" style="margin-left:6px;">SCADUTA</span>
            </td>
            <td class="text-right" th:text="${due.formattedGrossAmount}">100,00 €</td>
            <td class="text-right" th:text="${due.formattedPaidAmount}">0,00 €</td>
            <td class="text-right" th:text="${due.formattedOpenAmount}">100,00 €</td>
            <td>
                            <span class="badge"
                                  th:classappend="${due.status == 'OPEN'} ? ' badge-draft' :
                                                  (${due.status == 'PARTIALLY_PAID'} ? ' badge-sent' :
                                                  (${due.status == 'PAID'} ? ' badge-active' : ' badge-cancelled'))"
                                  th:text="${due.status}">
                                OPEN
                            </span>
            </td>
            <td class="link-actions">
              <a th:if="${due.referenceType == 'CUSTOMER_INVOICE'}"
                 th:href="@{/invoices/{id}(id=${due.referenceId})}">
                <i class="bi bi-receipt"></i>
                <span>Fattura</span>
              </a>
              <a th:if="${due.referenceType == 'SUPPLIER_INVOICE'}"
                 th:href="@{/supplier-invoices/{id}(id=${due.referenceId})}">
                <i class="bi bi-receipt"></i>
                <span>Fattura</span>
              </a>
              <a th:href="@{/payment-dues/{id}(id=${due.id})}">
                <i class="bi bi-eye"></i>
                <span>Dettaglio</span>
              </a>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
  <div th:replace="~{fragments/layout :: appFooter}"></div>
</div>
</body>
</html>
