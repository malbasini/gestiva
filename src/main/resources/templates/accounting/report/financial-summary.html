<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Situazione contabile sintetica</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: appHeader}"></div>

    <main class="app-main">
        <div class="page">
            <div class="card">
                <div th:replace="~{fragments/layout :: flashMessages}"></div>

                <div class="page-header">
                    <div class="page-header-left">
                        <h1 class="page-title">Situazione contabile sintetica</h1>
                        <div class="muted">Riepilogo saldi per classi contabili</div>
                    </div>
                </div>

                <form method="get" class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label for="dateFrom" class="form-label">Dal</label>
                        <input id="dateFrom" name="dateFrom" type="date" class="form-control" th:value="${dateFrom}"/>
                    </div>

                    <div class="col-md-3">
                        <label for="dateTo" class="form-label">Al</label>
                        <input id="dateTo" name="dateTo" type="date" class="form-control" th:value="${dateTo}"/>
                    </div>

                    <div class="col-md-6">
                        <button type="submit" class="btn btn-outline-primary">
                            <i class="bi bi-search"></i>
                            <span>Cerca</span>
                        </button>

                        <a class="btn btn-outline-secondary" th:href="@{/accounting/financial-summary}">
                            <i class="bi bi-x-circle"></i>
                            <span>Reset</span>
                        </a>

                        <a class="btn btn-outline-info"
                           th:href="@{/accounting/financial-summary/export.csv(dateFrom=${dateFrom}, dateTo=${dateTo})}">
                            <i class="bi bi-download"></i>
                            <span>Export CSV</span>
                        </a>

                        <a class="btn btn-outline-success"
                           th:href="@{/accounting/financial-summary/export.xlsx(dateFrom=${dateFrom}, dateTo=${dateTo})}">
                            <i class="bi bi-file-earmark-excel"></i>
                            <span>Export XLSX</span>
                        </a>



                    </div>
                </form>

                <div class="info-grid two-cols" style="margin-top:24px;">
                    <div class="info-box">
                        <div class="label">Dal</div>
                        <div class="value" th:text="${financialSummary.formattedDateFrom}">01/05/2026</div>
                    </div>
                    <div class="info-box">
                        <div class="label">Al</div>
                        <div class="value" th:text="${financialSummary.formattedDateTo}">25/05/2026</div>
                    </div>
                </div>

                <div class="table-wrap" style="margin-top:20px;">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>Classe</th>
                            <th class="text-right">Saldo</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(financialSummary.rows)}">
                            <td colspan="2" class="muted">Nessun dato contabile nel periodo selezionato.</td>
                        </tr>

                        <tr th:each="row : ${financialSummary.rows}">
                            <td th:text="${row.accountTypeLabel}">Attività</td>
                            <td class="text-right" th:text="${row.formattedAmount}">0,00</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: appFooter}"></div>
</div>
</body>
</html>
