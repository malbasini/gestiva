<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Situazione contabile per classi</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/layout :: appHeader}"></div>

  <main class="app-main">
    <div class="page">
      <div class="card">
        <div th:replace="~{fragments/layout :: flashMessages}"></div>

        <div class="page-header">
          <div class="page-header-left">
            <h1 class="page-title">Situazione contabile per classi</h1>
            <div class="muted">Dettaglio dei conti raggruppati per classe contabile</div>
          </div>
        </div>

        <form method="get" class="row g-3 align-items-end">
          <div class="col-md-3">
            <label for="dateFrom" class="form-label">Dal</label>
            <input id="dateFrom" name="dateFrom" type="date" class="form-control" th:value="${dateFrom}"/>
          </div>

          <div class="col-md-3">
            <label for="dateTo" class="form-label">Al</label>
            <input id="dateTo" name="dateTo" type="date" class="form-control" th:value="${dateTo}"/>
          </div>

          <div class="col-md-6">
            <button type="submit" class="btn btn-outline-primary">
              <i class="bi bi-search"></i>
              <span>Cerca</span>
            </button>

            <a class="btn btn-outline-secondary" th:href="@{/accounting/financial-summary-detail}">
              <i class="bi bi-x-circle"></i>
              <span>Reset</span>
            </a>
          </div>
        </form>

        <div class="info-grid two-cols" style="margin-top:24px;">
          <div class="info-box">
            <div class="label">Dal</div>
            <div class="value" th:text="${financialSummary.formattedDateFrom}">01/05/2026</div>
          </div>
          <div class="info-box">
            <div class="label">Al</div>
            <div class="value" th:text="${financialSummary.formattedDateTo}">25/05/2026</div>
          </div>
        </div>

        <div th:if="${#lists.isEmpty(financialSummary.sections)}" class="muted" style="margin-top:20px;">
          Nessun dato contabile nel periodo selezionato.
        </div>

        <div th:each="section : ${financialSummary.sections}" class="card" style="margin-top:20px; padding:16px;">
          <div class="page-header" style="margin-bottom:12px;">
            <div class="page-header-left">
              <h2 class="page-title" style="font-size:1.1rem;" th:text="${section.accountTypeLabel}">Attività</h2>
            </div>
            <div class="page-header-right">
              <strong th:text="${section.formattedSectionTotal}">0,00</strong>
            </div>
          </div>

          <div class="table-wrap">
            <table class="table">
              <thead>
              <tr>
                <th>Codice</th>
                <th>Conto</th>
                <th class="text-right">Saldo</th>
              </tr>
              </thead>
              <tbody>
              <tr th:each="detail : ${section.details}">
                <td th:text="${detail.accountCode}">1210</td>
                <td th:text="${detail.accountName}">Crediti verso clienti</td>
                <td class="text-right" th:text="${detail.formattedAmount}">0,00</td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </main>

  <div th:replace="~{fragments/layout :: appFooter}"></div>
</div>
</body>
</html>
