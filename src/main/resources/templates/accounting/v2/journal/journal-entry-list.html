<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Scritture contabili V2</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/layout :: appHeader}"></div>
  <main class="app-main">
    <div class="page">
      <div th:replace="~{fragments/layout :: flashMessages}"></div>
      <div class="card">
        <div class="breadcrumb">
          <a th:href="@{/dashboard}">Dashboard</a> /
          <span>Scritture contabili V2</span>
        </div>

        <div class="page-header">
          <div class="page-header-left">
            <h1 class="page-title">Scritture contabili V2</h1>
            <div class="muted">Registrazioni in partita doppia</div>
          </div>
          <div class="page-header-right">
            <a class="btn btn-primary" th:href="@{/v2/journal-entries/new}">
              <i class="bi bi-plus-lg"></i>
              <span>Nuova scrittura</span>
            </a>
          </div>
        </div>

        <table class="table">
          <thead>
          <tr>
            <th>Numero</th>
            <th>Data</th>
            <th>Causale</th>
            <th>Descrizione</th>
            <th class="text-right">Dare</th>
            <th class="text-right">Avere</th>
            <th>Stato</th>
            <th>Azioni</th>
          </tr>
          </thead>
          <tbody>
          <tr th:if="${#lists.isEmpty(entries)}">
            <td colspan="8" class="muted">Nessuna scrittura V2 trovata.</td>
          </tr>
          <tr th:each="entry : ${entries}">
            <td th:text="${entry.entryNumber}">JE-00001</td>
            <td th:text="${entry.formattedEntryDate}">10/05/2026</td>
            <td th:text="${entry.causalCode}">MANUAL_JOURNAL</td>
            <td th:text="${entry.description}">Giroconto iniziale</td>
            <td class="text-right" th:text="${entry.formattedTotalDebit}">100,00 €</td>
            <td class="text-right" th:text="${entry.formattedTotalCredit}">100,00 €</td>
            <td>
                            <span class="g-badge"
                                  th:classappend="${entry.posted} ? ' g-badge-active' : ' g-badge-draft'"
                                  th:text="${entry.posted} ? 'POSTED' : 'DRAFT'">POSTED</span>
            </td>
            <td class="link-actions">
              <a th:href="@{/v2/journal-entries/{id}(id=${entry.id})}">
                <i class="bi bi-eye"></i>
                <span>Dettaglio</span>
              </a>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
  <div th:replace="~{fragments/layout :: appFooter}"></div>
</div>
</body>
</html>
