<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Piano dei conti</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/layout :: appHeader}"></div>
    <main class="app-main">
        <div class="page">
            <div th:replace="~{fragments/layout :: flashMessages}"></div>
            <div class="card">
                <div class="breadcrumb">
                    <a th:href="@{/dashboard}">Dashboard</a> /
                    <span>Piano dei conti V2</span>
                </div>

                <div class="page-header">
                    <div class="page-header-left">
                        <h1 class="page-title">Piano dei conti</h1>
                        <div class="muted">Base contabile V2 per scritture in partita doppia</div>
                    </div>
                </div>

                <table class="table">
                    <thead>
                    <tr>
                        <th>Codice</th>
                        <th>Nome</th>
                        <th>Tipo</th>
                        <th>Natura</th>
                        <th>Livello</th>
                        <th>Padre</th>
                        <th>Flags</th>
                        <th>Azioni</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(accounts)}">
                        <td colspan="7" class="muted">Nessun conto trovato.</td>
                    </tr>
                    <tr th:each="account : ${accounts}">
                        <td th:text="${account.code}">1000</td>
                        <td th:text="${account.indentedName}">Attività</td>
                        <td th:text="${account.accountType}">ASSET</td>
                        <td th:text="${account.nature}">DEBIT</td>
                        <td th:text="${account.levelNo}">1</td>
                        <td>
                            <span th:if="${account.parentCode != null}"
                                  th:text="${account.parentCode + ' - ' + account.parentName}">1000 - Attività</span>
                            <span th:if="${account.parentCode == null}" class="muted">-</span>
                        </td>
                        <td>
                            <span class="g-badge g-badge-confirmed" th:if="${account.leafAccount}">LEAF</span>
                            <span class="g-badge g-badge-draft" th:if="${!account.leafAccount}">GROUP</span>

                            <span class="g-badge g-badge-active" th:if="${account.active}">ACTIVE</span>
                            <span class="g-badge g-badge-cancelled" th:if="${!account.active}">INACTIVE</span>

                            <span class="g-badge g-badge-overdue" th:if="${account.systemAccount}">SYSTEM</span>
                        </td>
                        <td class="link-actions">
                            <a th:href="@{/v2/accounts/{id}(id=${account.id})}">
                                <i class="bi bi-journal-text"></i>
                                <span>Mastrino</span>
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <div th:replace="~{fragments/layout :: appFooter}"></div>
</div>
</body>
</html>
