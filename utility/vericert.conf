server {
    listen 80;
    server_name app.vercert.org; 

    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.vercert.org;

    ssl_certificate     /etc/letsencrypt/live/app.vercert.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.vercert.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ✅ intercetta gli errori del proxy e mostra una pagina "avvio in corso"
    proxy_intercept_errors on;
    error_page 502 503 504 /starting.html;

    location = /starting.html {
        root /usr/share/nginx/html;
        internal;
    }
    location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
    }
    location / {
        proxy_pass http://vericert-app:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 20s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s; 
        send_timeout 75s;
  }

}
server {
    listen 80;
    server_name gestiva.org www.gestiva.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://gestiva.org$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name gestiva.org www.gestiva.org;

    ssl_certificate /etc/letsencrypt/live/gestiva.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gestiva.org/privkey.pem;

    client_max_body_size 20m;

    # Aggiunto per intercettare gli errori del proxy e mostrare una pagina "avvio in corso"
    proxy_intercept_errors on;
    error_page 502 503 504 /starting.html;

    location = /starting.html {
        root /usr/share/nginx/html;
        internal;
    }

    location / {
    proxy_pass http://65.108.158.204:8081;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Host $host;
  }
}
 
